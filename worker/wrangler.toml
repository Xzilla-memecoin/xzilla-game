name = "xzilla-leaderboard"
main = "src/index.js"
compatibility_date = "2024-09-01"

# KV namespace that stores the board. Create it once and paste the id below:
#   npx wrangler kv namespace create LB
# Wrangler prints an id — put it here:
kv_namespaces = [
  { binding = "LB", id = "71fa6f557b9240958c909b8b4bf5d3a8" }
]

# BOT_TOKEN is a SECRET — do NOT put it in this file. Set it with:
#   npx wrangler secret put BOT_TOKEN
# (paste your @BotFather token when prompted)
