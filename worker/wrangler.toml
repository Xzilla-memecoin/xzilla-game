name = "xzilla-leaderboard"
main = "src/index.js"
compatibility_date = "2024-09-01"

# KV namespace that stores the board. Create it once and paste the id below:
#   npx wrangler kv namespace create LB
# Wrangler prints an id — put it here:
kv_namespaces = [
  { binding = "LB", id = "71fa6f557b9240958c909b8b4bf5d3a8" }
]

# Google Sign-In. NOT a secret — the client id ships in the page source by design, and
# the Worker only uses it to check the `aud` claim of an ID token it has already verified
# against Google's public keys. Must match GOOGLE_CLIENT_ID in index.html.
[vars]
GOOGLE_CLIENT_ID = "812393204247-o0cgfueu8qa2dei79m78mv9hd85op41d.apps.googleusercontent.com"
# Discord Sign-In. The client id is NOT a secret — it travels in the authorize URL that
# every player's browser follows. The matching DISCORD_CLIENT_SECRET is a secret and must
# be set with `npx wrangler secret put DISCORD_CLIENT_SECRET`, never written here.
# The redirect registered in the Discord app must match byte-for-byte:
#   https://xzilla-leaderboard.kombainain.workers.dev/auth/discord/callback
DISCORD_CLIENT_ID = "1534847719171031091"

# SESSION_SECRET is a SECRET — signs web session tokens. Set it with:
#   npx wrangler secret put SESSION_SECRET
# (any long random string; rotating it signs everyone out, which is safe)
#
# TURNSTILE_SECRET is a SECRET (optional) — gates account creation against bots.
# Turnstile checks are skipped entirely until this is set:
#   npx wrangler secret put TURNSTILE_SECRET
#
# BOT_TOKEN is a SECRET — do NOT put it in this file. Set it with:
#   npx wrangler secret put BOT_TOKEN
# (paste your @BotFather token when prompted)
#
# HELIUS_KEY is a SECRET — powers the /balance $XZILLA holder check. Set it with:
#   npx wrangler secret put HELIUS_KEY
# (paste the API key from your free https://helius.dev project)
# Optional: override the token mint without a code change:
#   [vars]
#   XZILLA_MINT = "2VzDVUgzTHSf9qCPdkYBeMd2sK7m8t9GR2MN5kxRpump"
#
# ADS_ADMIN_TOKEN is a SECRET — gates POST /ads (instant in-game billboard updates).
# Rotate it any time with:
#   npx wrangler secret put ADS_ADMIN_TOKEN
