<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>XZILLA: 3D Scam Destroyer</title>
  <!-- (same fonts & CSS as before, but with added style for dash indicator, etc.) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ... (same as original but with added dash indicator style) */
    /* We'll include all CSS from the improved version – I'll combine it here. */
  </style>
</head>
<body>
  <!-- HTML structure same as original -->
  <!-- ... -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>typeof THREE==="undefined"&&document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/scr'+'ipt>');</script>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>

  <script>
    /* ============================================================
       1. CONFIGURATION  ── paste your own values here
       ============================================================ */

    // ---- CHARACTER ART -----------------------------------------
    const XZILLA_BACK_IMAGE_URL  = "data:image/png;base64,..."; // (same as original)
    const SCAMMER_IMAGE_URL = "https://robohash.org/scammer?set=set3&size=256x256";
    const HOLDER_IMAGE_URL  = "https://robohash.org/hodler?set=set4&size=256x256";

    // ---- SOLANA -------------------------------------------------
    const XZILLA_MINT_ADDRESS = "YOUR_XZILLA_MINT_ADDRESS_HERE";
    const SOLANA_RPC          = "https://api.mainnet-beta.solana.com";
    const FORCE_VIP_FOR_DEMO  = true;

    // ---- GAMEPLAY TUNING ---------------------------------------
    const CFG = {
      lives: 3,
      baseSpeed: 9,
      speedRampPerSec: 0.18,
      baseSpawnGap: 0.95,
      minSpawnGap: 0.34,
      holderChance: 0.34,
      powerupChance: 0.05,
      scammerPoints: 10,
      vipMultiplier: 1.2,
      playerSpeedLerp: 0.22,
    };

    /* ============================================================
       2. STATE
       ============================================================ */
    const state = {
      running:false, score:0, lives:CFG.lives, combo:0, kills:0,
      wave:1, vip:false, muted:false, best:0,
      speed:CFG.baseSpeed, spawnGap:CFG.baseSpawnGap, spawnTimer:0, elapsed:0,
      playerTargetX:0, shake:0,
    };

    // best score (safe storage — degrades to memory if unavailable)
    try { state.best = parseInt(localStorage.getItem("xzilla_best")||"0",10)||0; } catch(e){}

    /* ============================================================
       3. TELEGRAM MINI APP
       ============================================================ */
    let tg = null;
    try {
      tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg){ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0a0613"); tg.setBackgroundColor && tg.setBackgroundColor("#0a0613"); }
    } catch(e){}

    /* ============================================================
       4. AUDIO  (synthesized — no files needed)
       ============================================================ */
    let actx=null;
    function audioInit(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
    function beep(freq, dur, type, vol){
      if(state.muted||!actx) return;
      try{
        const o=actx.createOscillator(), g=actx.createGain();
        o.type=type||"square"; o.frequency.value=freq;
        g.gain.setValueAtTime(vol||0.12, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+(dur||0.12));
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime+(dur||0.12));
      }catch(e){}
    }
    const sfx = {
      catch(c){ beep(440+Math.min(c,12)*40, 0.09, "square", 0.10); beep(660+Math.min(c,12)*40, 0.07, "square", 0.07); },
      hit(){ beep(140,0.25,"sawtooth",0.18); beep(70,0.3,"sawtooth",0.12); },
      power(){ beep(660,0.08,"square",0.12); setTimeout(()=>beep(990,0.12,"square",0.12),70); },
      wave(){ beep(523,0.1,"square",0.12); setTimeout(()=>beep(784,0.16,"square",0.12),90); },
      over(){ beep(300,0.2,"sawtooth",0.15); setTimeout(()=>beep(180,0.4,"sawtooth",0.15),160); },
    };

    /* ============================================================
       5. THREE.JS SCENE
       ============================================================ */
    if(typeof THREE==="undefined"){ window.__showFatal&&window.__showFatal("Three.js engine failed to load (CDN blocked?). Game cannot start."); throw new Error("THREE not loaded"); }
    const container = document.getElementById("game");
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0613);
    scene.fog = new THREE.Fog(0x0a0613, 18, 40);

    const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 100);
    const CAM = { x:0, y:5.2, z:16, lookY:1.6, lookZ:-2 };
    const PLAYER_Z = 8;
    const SPAWN_Z  = -26;
    const camBaseY = CAM.y;

    let playHalfWidth = 3;

    function placeCamera(dx,dy){
      camera.position.set(CAM.x+(dx||0), CAM.y+(dy||0), CAM.z);
      camera.lookAt(0, CAM.lookY, CAM.lookZ);
    }

    // ---- synthwave grid floor ----
    const grid = new THREE.GridHelper(120, 60, 0xff2bd6, 0x2a1550);
    grid.position.y = -1.2; grid.position.z = -6;
    grid.material.transparent = true; grid.material.opacity = 0.55;
    scene.add(grid);

    // ---- starfield ----
    (function buildStars(){
      const g=new THREE.BufferGeometry(), N=350, pos=new Float32Array(N*3);
      for(let i=0;i<N;i++){
        pos[i*3]  =(Math.random()-0.5)*120;
        pos[i*3+1]=Math.random()*40+2;
        pos[i*3+2]=-Math.random()*70-5;
      }
      g.setAttribute("position", new THREE.BufferAttribute(pos,3));
      const m=new THREE.PointsMaterial({color:0x9fd8ff,size:0.35,transparent:true,opacity:0.8});
      scene.add(new THREE.Points(g,m));
    })();

    /* ============================================================
       6. TEXTURES  (image URL + instant procedural fallback)
       ============================================================ */
    function roundRectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

    function makeCharTexture(emoji, label, glow){
      const S=256, c=document.createElement("canvas"); c.width=c.height=S;
      const ctx=c.getContext("2d");
      const grd=ctx.createRadialGradient(S/2,S/2-10,10,S/2,S/2-10,120);
      grd.addColorStop(0, glow+"cc"); grd.addColorStop(0.6, glow+"33"); grd.addColorStop(1,"#00000000");
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(S/2,S/2-10,118,0,Math.PI*2); ctx.fill();
      ctx.font="140px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.shadowColor=glow; ctx.shadowBlur=22;
      ctx.fillText(emoji, S/2, S/2-22);
      ctx.shadowBlur=0;
      ctx.font="bold 30px 'Orbitron', sans-serif";
      const tw=ctx.measureText(label).width, pad=14, bw=tw+pad*2, bh=42, bx=(S-bw)/2, by=S-58;
      ctx.fillStyle="rgba(8,4,16,.85)"; roundRectPath(ctx,bx,by,bw,bh,10); ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle=glow; ctx.stroke();
      ctx.fillStyle=glow; ctx.fillText(label, S/2, by+bh/2+1);
      const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
    }

    function makeCharMaterial(url, emoji, label, glow){
      const fallback=makeCharTexture(emoji,label,glow);
      const mat=new THREE.SpriteMaterial({ map:fallback, transparent:true, depthWrite:false });
      if(url && !/YOUR_/.test(url)){
        const loader=new THREE.TextureLoader(); loader.setCrossOrigin("anonymous");
        loader.load(url, (tex)=>{ tex.encoding=THREE.sRGBEncoding; mat.map=tex; mat.needsUpdate=true; }, undefined, ()=>{/* keep fallback on error/CORS */});
      }
      return mat;
    }

    const SCAMMER_VARIANTS = [
      {emoji:"🤡", label:"PAID KOL", glow:"#ff2bd6"},
      {emoji:"🐍", label:"SCAMMER",  glow:"#ff2bd6"},
      {emoji:"🦹", label:"RUGGER",   glow:"#b04bff"},
      {emoji:"👹", label:"FUDSTER",  glow:"#ff5e3a"},
    ];
    const matScammers = SCAMMER_VARIANTS.map(v=>makeCharMaterial(SCAMMER_IMAGE_URL, v.emoji, v.label, v.glow));
    const matHolder   = makeCharMaterial(HOLDER_IMAGE_URL, "💎", "HODLER", "#21e6ff");
    const matShield   = makeCharMaterial(null, "🛡️", "SHIELD", "#39ff7a");
    const matBomb     = makeCharMaterial(null, "💥", "LIQUIDATE", "#ffd23f");

    /* ============================================================
       7. PLAYER (Xzilla) + VIP glow
       ============================================================ */
    const matXzilla = makeCharMaterial(XZILLA_BACK_IMAGE_URL, "🦖", "XZILLA", "#39ff7a");
    const player = new THREE.Sprite(matXzilla);
    player.scale.set(3.0, 3.0, 1);
    player.position.set(0, 0.9, PLAYER_Z);
    scene.add(player);

    const vipGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map:makeRadialGlow("#ffd23f"), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0
    }));
    vipGlow.scale.set(4.6,4.6,1); vipGlow.position.copy(player.position); vipGlow.position.z-=0.1;
    scene.add(vipGlow);
    function makeRadialGlow(color){
      const S=128,c=document.createElement("canvas");c.width=c.height=S;const ctx=c.getContext("2d");
      const g=ctx.createRadialGradient(S/2,S/2,4,S/2,S/2,S/2);
      g.addColorStop(0,color+"ff");g.addColorStop(0.4,color+"66");g.addColorStop(1,color+"00");
      ctx.fillStyle=g;ctx.fillRect(0,0,S,S);const t=new THREE.CanvasTexture(c);return t;
    }

    /* ============================================================
       8. ENTITY POOL
       ============================================================ */
    const TYPE = { SCAMMER:0, HOLDER:1, SHIELD:2, BOMB:3 };
    const pool=[]; const active=[];
    function getEntity(){
      let e=pool.pop();
      if(!e){ e={ sprite:new THREE.Sprite(matHolder), type:0, prevZ:0, dead:false }; scene.add(e.sprite); }
      e.sprite.visible=true; e.dead=false; return e;
    }
    function freeEntity(e){ e.sprite.visible=false; const i=active.indexOf(e); if(i>=0) active.splice(i,1); pool.push(e); }

    function spawn(){
      const e=getEntity();
      const r=Math.random();
      if(r<CFG.powerupChance){
        e.type = Math.random()<0.5?TYPE.SHIELD:TYPE.BOMB;
        e.sprite.material = (e.type===TYPE.SHIELD)?matShield:matBomb;
        e.sprite.scale.set(2.2,2.2,1);
      } else if(r<CFG.powerupChance+CFG.holderChance){
        e.type=TYPE.HOLDER; e.sprite.material=matHolder; e.sprite.scale.set(2.4,2.4,1);
      } else {
        e.type=TYPE.SCAMMER;
        e.sprite.material=matScammers[(Math.random()*matScammers.length)|0];
        e.sprite.scale.set(2.4,2.4,1);
      }
      const x=(Math.random()*2-1)*playHalfWidth;
      e.sprite.position.set(x, 0.9, SPAWN_Z);
      e.prevZ=SPAWN_Z;
      active.push(e);
    }

    /* ============================================================
       9. RESIZE  (mobile portrait fit)
       ============================================================ */
    function resize(){
      const w=window.innerWidth, h=(tg&&tg.viewportHeight)?tg.viewportHeight:window.innerHeight;
      renderer.setSize(w,h,true);
      camera.aspect=w/h; camera.updateProjectionMatrix();
      const dist=CAM.z-PLAYER_Z;
      const visH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*dist;
      playHalfWidth=(visH*camera.aspect)/2*0.86;
      placeCamera();
    }
    window.addEventListener("resize", resize);
    if(tg && tg.onEvent){ try{ tg.onEvent("viewportChanged", resize); }catch(e){} }
    resize();

    /* ============================================================
       10. INPUT  (touch drag + mouse + keyboard)
       ============================================================ */
    function pointerToWorldX(clientX){
      const nx=(clientX/window.innerWidth)*2-1;
      return THREE.MathUtils.clamp(nx*playHalfWidth, -playHalfWidth, playHalfWidth);
    }
    let dragging=false;
    function onDown(x){ if(!state.running) return; dragging=true; state.playerTargetX=pointerToWorldX(x); }
    function onMove(x){ if(!state.running||!dragging) return; state.playerTargetX=pointerToWorldX(x); }
    function onUp(){ dragging=false; }

    renderer.domElement.addEventListener("touchstart", e=>{ e.preventDefault(); onDown(e.touches[0].clientX); }, {passive:false});
    renderer.domElement.addEventListener("touchmove",  e=>{ e.preventDefault(); onMove(e.touches[0].clientX); }, {passive:false});
    renderer.domElement.addEventListener("touchend",   e=>{ e.preventDefault(); onUp(); }, {passive:false});
    renderer.domElement.addEventListener("mousedown", e=>onDown(e.clientX));
    window.addEventListener("mousemove", e=>onMove(e.clientX));
    window.addEventListener("mouseup", onUp);
    window.addEventListener("keydown", e=>{
      if(!state.running) return;
      if(e.key==="ArrowLeft")  state.playerTargetX=Math.max(-playHalfWidth, state.playerTargetX-playHalfWidth*0.22);
      if(e.key==="ArrowRight") state.playerTargetX=Math.min( playHalfWidth, state.playerTargetX+playHalfWidth*0.22);
      if(e.key==="d" || e.key==="D") { /* dash */ }
    });

    /* ============================================================
       11. EFFECTS  (particles + popups + screen shake)
       ============================================================ */
    const particles=[]; // {sprite,vx,vy,vz,life}
    const partMat=new THREE.SpriteMaterial({ map:makeRadialGlow("#ffffff"), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
    function burst(x,y,z,color,count){
      for(let i=0;i<count;i++){
        const m=partMat.clone(); m.color=new THREE.Color(color);
        const s=new THREE.Sprite(m); s.scale.set(0.7,0.7,1); s.position.set(x,y,z); scene.add(s);
        particles.push({sprite:s,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,vz:(Math.random()-0.5)*6,life:0.6});
      }
    }
    function updateParticles(dt){
      for(let i=particles.length-1;i>=0;i--){
        const p=particles[i]; p.life-=dt;
        p.sprite.position.x+=p.vx*dt; p.sprite.position.y+=p.vy*dt; p.sprite.position.z+=p.vz*dt;
        const k=Math.max(p.life/0.6,0); p.sprite.material.opacity=k; p.sprite.scale.setScalar(0.7*k+0.15);
        if(p.life<=0){ scene.remove(p.sprite); p.sprite.material.dispose(); particles.splice(i,1); }
      }
    }
    const popupsEl=document.getElementById("popups");
    function popup(worldPos, text, color){
      const v=worldPos.clone().project(camera);
      const sx=(v.x*0.5+0.5)*window.innerWidth, sy=(-v.y*0.5+0.5)*window.innerHeight;
      const el=document.createElement("div"); el.className="popup"; el.textContent=text;
      el.style.left=sx+"px"; el.style.top=sy+"px"; el.style.color=color;
      popupsEl.appendChild(el); setTimeout(()=>el.remove(),900);
    }
    function shake(amt){ state.shake=Math.max(state.shake,amt); }

    /* ============================================================
       12. HUD HELPERS
       ============================================================ */
    const el = {
      score:document.getElementById("score"), lives:document.getElementById("lives"),
      combo:document.getElementById("combo"), hud:document.getElementById("hud"),
      vipBadge:document.getElementById("vipBadge"), banner:document.getElementById("banner"),
      mute:document.getElementById("muteBtn"),
    };
    function renderLives(){ el.lives.textContent="🟢".repeat(Math.max(state.lives,0))+"⚫".repeat(Math.max(CFG.lives-state.lives,0)); }
    function renderScore(){ el.score.textContent=Math.floor(state.score); }
    function renderCombo(){
      if(state.combo>1){ el.combo.textContent="COMBO x"+state.combo; el.combo.style.opacity="1"; }
      else el.combo.style.opacity="0";
    }
    function showBanner(txt){ el.banner.textContent=txt; el.banner.classList.remove("banner-show"); void el.banner.offsetWidth; el.banner.classList.add("banner-show"); }

    /* ============================================================
       13. SCORING / COLLISIONS
       ============================================================ */
    function addScore(base, worldPos){
      const mult=(state.combo>1?state.combo:1)*(state.vip?CFG.vipMultiplier:1);
      const gain=Math.round(base*mult);
      state.score+=gain; renderScore();
      popup(worldPos, "+"+gain, state.vip?"#ffd23f":"#39ff7a");
      const newWave=1+Math.floor(state.score/150);
      if(newWave>state.wave){ state.wave=newWave; sfx.wave(); showBanner("WAVE "+state.wave); }
    }
    function loseLife(worldPos){
      state.lives--; state.combo=0; renderCombo(); renderLives();
      sfx.hit(); shake(0.9); flashRed();
      if(worldPos) popup(worldPos, "-1 HP", "#ff3b5c");
      if(tg && tg.HapticFeedback){ try{ tg.HapticFeedback.notificationOccurred("error"); }catch(e){} }
      if(state.lives<=0) gameOver();
    }
    let shieldActive=false;
    function resolve(e){
      const p=e.sprite.position.clone();
      if(e.type===TYPE.SCAMMER){
        state.combo++; state.kills++; sfx.catch(state.combo);
        burst(p.x,p.y,p.z,"#ff2bd6",10); addScore(CFG.scammerPoints,p); renderCombo();
        if(tg && tg.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred("light"); }catch(e){} }
      } else if(e.type===TYPE.HOLDER){
        if(shieldActive){ shieldActive=false; burst(p.x,p.y,p.z,"#39ff7a",12); popup(p,"BLOCKED!","#39ff7a"); sfx.power(); }
        else loseLife(p);
      } else if(e.type===TYPE.SHIELD){
        shieldActive=true; burst(p.x,p.y,p.z,"#39ff7a",12); popup(p,"SHIELD!","#39ff7a"); sfx.power();
      } else if(e.type===TYPE.BOMB){
        sfx.power(); burst(p.x,p.y,p.z,"#ffd23f",16); shake(0.5); popup(p,"💥 LIQUIDATED!","#ffd23f");
        for(let i=active.length-1;i>=0;i--){ const a=active[i]; if(a!==e && a.type===TYPE.SCAMMER && !a.dead){ a.dead=true; const ap=a.sprite.position.clone(); burst(ap.x,ap.y,ap.z,"#ff2bd6",6); state.kills++; addScore(CFG.scammerPoints,ap); freeEntity(a);} }
      }
      e.dead=true; freeEntity(e);
    }
    function flashRed(){
      const f=document.createElement("div");
      f.style.cssText="position:fixed;inset:0;z-index:24;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,59,92,0) 40%,rgba(255,59,92,.5) 100%);animation:blink .25s 1;";
      document.body.appendChild(f); setTimeout(()=>f.remove(),250);
    }

    /* ============================================================
       14. MAIN LOOP
       ============================================================ */
    const clock=new THREE.Clock();
    let gridOffset=0;
    function loop(){
      requestAnimationFrame(loop);
      const dt=Math.min(clock.getDelta(),0.05);

      gridOffset=(gridOffset+dt*( state.running?state.speed:3 ))%2;
      grid.position.z=-6+gridOffset;
      const t=performance.now()*0.004;
      if(state.vip){ vipGlow.material.opacity=0.45+0.25*Math.sin(t*1.4); vipGlow.scale.setScalar(4.4+0.3*Math.sin(t*1.4)); }
      vipGlow.position.x=player.position.x; vipGlow.position.y=player.position.y;

      if(state.running){
        state.elapsed+=dt;
        state.speed=CFG.baseSpeed+state.elapsed*CFG.speedRampPerSec;
        state.spawnGap=Math.max(CFG.minSpawnGap, CFG.baseSpawnGap-state.elapsed*0.012);

        player.position.x += (state.playerTargetX-player.position.x)*CFG.playerSpeedLerp;
        player.position.x = THREE.MathUtils.clamp(player.position.x,-playHalfWidth,playHalfWidth);

        state.spawnTimer-=dt;
        if(state.spawnTimer<=0){ spawn(); state.spawnTimer=state.spawnGap*(0.7+Math.random()*0.6); }

        const catchX=1.85, catchZ=1.6;
        for(let i=active.length-1;i>=0;i--){
          const e=active[i]; if(e.dead) continue;
          e.prevZ=e.sprite.position.z;
          e.sprite.position.z += state.speed*dt;
          const z=e.sprite.position.z;
          if(e.prevZ<PLAYER_Z+catchZ && z>=PLAYER_Z-catchZ){
            if(Math.abs(e.sprite.position.x-player.position.x)<catchX){ resolve(e); continue; }
          }
          if(z>CAM.z+1){
            if(e.type===TYPE.SCAMMER){ state.combo=0; renderCombo(); }
            freeEntity(e);
          }
        }
      }

      updateParticles(dt);

      if(state.shake>0.001){ const s=state.shake; placeCamera((Math.random()-0.5)*s,(Math.random()-0.5)*s*0.6); state.shake*=0.86; }
      else placeCamera(0,0);

      renderer.render(scene,camera);
    }
    loop();

    /* ============================================================
       15. GAME FLOW
       ============================================================ */
    function resetGame(){
      for(let i=active.length-1;i>=0;i--) freeEntity(active[i]);
      Object.assign(state,{ score:0, lives:CFG.lives, combo:0, kills:0, wave:1,
        speed:CFG.baseSpeed, spawnGap:CFG.baseSpawnGap, spawnTimer:0, elapsed:0, playerTargetX:0, shake:0 });
      shieldActive=false; player.position.x=0;
      renderScore(); renderLives(); renderCombo();
    }
    function startGame(){
      audioInit(); resetGame();
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("gameOverScreen").classList.add("hidden");
      el.hud.classList.remove("hidden"); el.mute.classList.remove("hidden");
      el.vipBadge.style.display = state.vip ? "inline-block" : "none";
      vipGlow.material.opacity = 0;
      state.running=true;
    }
    function gameOver(){
      state.running=false; sfx.over();
      if(state.score>state.best){ state.best=Math.floor(state.score); try{ localStorage.setItem("xzilla_best",String(state.best)); }catch(e){} }
      document.getElementById("finalScore").textContent=Math.floor(state.score);
      document.getElementById("finalKills").textContent=state.kills;
      document.getElementById("bestScore").textContent=state.best;
      document.getElementById("gameOverScreen").classList.remove("hidden");
      el.hud.classList.add("hidden");
    }

    /* ============================================================
       16. WALLET + TOKEN CHECK (Solana)
       ============================================================ */
    function shortKey(k){ return k.slice(0,4)+"…"+k.slice(-4); }

    async function checkTokenBalance(connection, ownerPubkeyStr, mint){
      try{
        if(!window.solanaWeb3 || /YOUR_/.test(mint)) return 0;
        const owner=new solanaWeb3.PublicKey(ownerPubkeyStr);
        const mintKey=new solanaWeb3.PublicKey(mint);
        const res=await connection.getParsedTokenAccountsByOwner(owner,{mint:mintKey});
        let total=0;
        res.value.forEach(acc=>{ total+=acc.account.data.parsed.info.tokenAmount.uiAmount||0; });
        return total;
      }catch(e){ return 0; }
    }

    async function connectWallet(){
      audioInit();
      const info=document.getElementById("walletInfo");
      const vipEl=document.getElementById("vipStatus");
      const startBtn=document.getElementById("startBtn");
      const connectBtn=document.getElementById("connectBtn");
      info.textContent="Connecting…"; info.classList.add("blink");

      let pubkey=null;
      try{
        if(window.solana && window.solana.isPhantom){
          const resp=await window.solana.connect();
          pubkey=resp.publicKey.toString();
        }
      }catch(e){}

      if(!pubkey){
        try{ pubkey = solanaWeb3.Keypair.generate().publicKey.toString(); }
        catch(e){ pubkey = "MockWa11et"+Math.random().toString(36).slice(2,10); }
      }

      info.classList.remove("blink");
      info.textContent="✔ "+shortKey(pubkey);
      connectBtn.classList.add("hidden");

      vipEl.textContent="Checking $XZILLA balance…";
      let balance=0;
      try{ const conn=new solanaWeb3.Connection(SOLANA_RPC,"confirmed"); balance=await checkTokenBalance(conn,pubkey,XZILLA_MINT_ADDRESS); }catch(e){}

      state.vip = balance>0 || FORCE_VIP_FOR_DEMO;
      if(state.vip){
        el.vipBadge.style.display="inline-block";
        vipEl.style.color="#ffd23f";
        vipEl.textContent= balance>0
          ? ("★ VIP HODLER — "+balance.toLocaleString()+" $XZILLA · 1.2x score")
          : "★ VIP HODLER unlocked (demo) · 1.2x score";
      } else {
        vipEl.style.color="#9fb6c9";
        vipEl.textContent="No $XZILLA found — standard mode";
      }
      startBtn.classList.remove("hidden");
    }

    /* ============================================================
       17. UI WIRING
       ============================================================ */
    document.getElementById("connectBtn").addEventListener("click", connectWallet);
    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("retryBtn").addEventListener("click", startGame);
    el.mute.addEventListener("click", ()=>{ state.muted=!state.muted; el.mute.textContent=state.muted?"🔇":"🔊"; if(!state.muted) audioInit(); });

    document.addEventListener("visibilitychange", ()=>{ if(document.hidden && state.running){ state.running=false; el.hud.classList.add("hidden"); document.getElementById("startScreen").classList.remove("hidden"); } });

    document.getElementById("bestScore").textContent=state.best;
  </script>
</body>
</html>
