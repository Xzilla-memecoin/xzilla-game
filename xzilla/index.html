<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xzilla - City Destruction</title>
    <style>
        /* ─── Global Reset & Fullscreen ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* ─── Game Wrapper ─── */
        .game-wrapper {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 28px;
            padding: 18px 18px 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 120px rgba(255, 80, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .game-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
        }

        canvas {
            display: block;
            width: 1000px;
            height: 600px;
            background: #0f0f23;
            cursor: pointer;
        }

        /* ─── HUD Overlay ─── */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 18px 24px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-left,
        .hud-right {
            pointer-events: auto;
        }

        .hud-score {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 200, 50, 0.5), 0 4px 12px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 18px 8px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .hud-score span {
            color: #ffd866;
            font-size: 28px;
        }

        .hud-combo {
            font-size: 20px;
            font-weight: 700;
            color: #ff6b6b;
            text-shadow: 0 0 30px rgba(255, 80, 80, 0.6);
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 100, 100, 0.2);
            margin-top: 8px;
            display: inline-block;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .hud-combo.active {
            opacity: 1;
        }

        .hud-right {
            text-align: right;
        }

        .hud-buildings {
            font-size: 18px;
            font-weight: 600;
            color: #aac9ff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 16px 8px 16px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-block;
        }

        .hud-buildings span {
            color: #ffd866;
        }

        /* ─── Controls Hint ─── */
        .controls-hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .controls-hint kbd {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin: 0 2px;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ─── Responsive ─── */
        @media (max-width: 1050px) {
            .game-wrapper {
                padding: 12px;
                border-radius: 18px;
            }
            canvas {
                width: 92vw;
                height: calc(92vw * 0.6);
                max-height: 85vh;
            }
            .hud-score {
                font-size: 24px;
                padding: 4px 14px 6px 14px;
            }
            .hud-buildings {
                font-size: 14px;
                padding: 4px 12px 6px 12px;
            }
            .controls-hint {
                font-size: 11px;
                padding: 4px 14px;
                bottom: 14px;
            }
        }

        @media (max-width: 600px) {
            .hud-score {
                font-size: 18px;
                padding: 3px 10px 5px 10px;
                gap: 4px;
            }
            .hud-score span {
                font-size: 18px;
            }
            .hud-buildings {
                font-size: 12px;
                padding: 3px 10px 5px 10px;
            }
            .controls-hint {
                font-size: 9px;
                padding: 3px 10px;
                bottom: 10px;
                white-space: normal;
            }
            .hud-combo {
                font-size: 14px;
                padding: 2px 10px;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-container">
            <canvas id="game" width="1000" height="600"></canvas>

            <!-- HUD -->
            <div class="hud">
                <div class="hud-top">
                    <div class="hud-left">
                        <div class="hud-score">
                            🏆 <span id="scoreDisplay">0</span>
                        </div>
                        <div class="hud-combo" id="comboDisplay">🔥 COMBO x<span id="comboCount">0</span></div>
                    </div>
                    <div class="hud-right">
                        <div class="hud-buildings">
                            🏙️ <span id="buildingCount">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls-hint">
                <kbd>←</kbd> <kbd>→</kbd> move &nbsp;·&nbsp; <kbd>␣</kbd> or <kbd>Click</kbd> destroy
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  XZILLA – CITY DESTRUCTION GAME
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = 1000,
            H = 600;

        // ─── DOM refs ───
        const scoreSpan = document.getElementById('scoreDisplay');
        const comboSpan = document.getElementById('comboCount');
        const comboDisplay = document.getElementById('comboDisplay');
        const buildingCountSpan = document.getElementById('buildingCount');

        // ─── Game state ───
        const G = {
            score: 0,
            combo: 0,
            maxCombo: 0,
            buildings: [],
            particles: [],
            fireParticles: [],
            debris: [],
            shakeX: 0,
            shakeY: 0,
            shakeDuration: 0,
            gameOver: false,
            spawnTimer: 0,
            spawnInterval: 45, // frames between spawns
            frame: 0,
        };

        // ─── Xzilla ───
        const XZ = {
            x: 200,
            y: 370, // feet level
            w: 70,
            h: 110,
            vx: 0,
            speed: 4,
            facing: 1, // 1 = right, -1 = left
            walkCycle: 0,
            breathing: false,
            breathTimer: 0,
            breathCooldown: 0,
            stompTimer: 0,
            eyeGlow: 0,
        };

        // ─── Constants ───
        const GROUND_Y = 460;
        const GRAVITY = 0.4;
        const MAX_BUILDINGS = 18;

        // ─── Utility ───
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        function lerp(a, b, t) { return a + (b - a) * t; }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // ─── Building ───
        class Building {
            constructor(x, w, h) {
                this.x = x;
                this.w = w;
                this.h = h;
                this.y = GROUND_Y - h;
                this.hp = Math.ceil(h / 20) + 1;
                this.maxHp = this.hp;
                this.color = this.randomColor();
                this.windowColor = this.randomWindowColor();
                this.windowRows = Math.floor(h / 22);
                this.windowCols = Math.floor(w / 18);
                this.destroyed = false;
                this.falling = false;
                this.fallTimer = 0;
                this.debrisSpawned = false;
                this.shakeX = 0;
                this.shakeY = 0;
                this.onFire = false;
                this.fireTimer = 0;
            }

            randomColor() {
                const colors = [
                    '#4a6fa5', '#6b4f8a', '#3d7a5a', '#8b5a3c',
                    '#5a6f8a', '#7a5a6f', '#4a7a6a', '#8a6a4a',
                    '#3a5a7a', '#6a4a7a', '#4a7a5a', '#7a5a4a'
                ];
                return colors[randInt(0, colors.length - 1)];
            }

            randomWindowColor() {
                const colors = ['#ffd866', '#ffb347', '#88ddff', '#ff6b6b', '#aaffaa'];
                return colors[randInt(0, colors.length - 1)];
            }

            get cx() { return this.x + this.w / 2; }
            get cy() { return this.y + this.h / 2; }

            draw(ctx) {
                if (this.destroyed && this.falling) {
                    // Draw falling building with rotation
                    ctx.save();
                    ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
                    const rot = this.fallTimer * 0.03;
                    ctx.rotate(rot);
                    ctx.globalAlpha = 1 - this.fallTimer / 180;
                    ctx.shadowColor = 'rgba(255,100,0,0.3)';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                    return;
                }

                if (this.destroyed) return;

                // Shake
                const sx = this.shakeX || 0;
                const sy = this.shakeY || 0;

                // Building body
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 4;

                // Gradient
                const grad = ctx.createLinearGradient(this.x, this.y, this.x + this.w, this.y + this.h);
                grad.addColorStop(0, this.lightenColor(this.color, 20));
                grad.addColorStop(0.5, this.color);
                grad.addColorStop(1, this.darkenColor(this.color, 30));
                ctx.fillStyle = grad;
                ctx.fillRect(this.x + sx, this.y + sy, this.w, this.h);

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // Border
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.strokeRect(this.x + sx, this.y + sy, this.w, this.h);

                // Windows
                const wCols = this.windowCols;
                const wRows = this.windowRows;
                const wGapX = this.w / (wCols + 1);
                const wGapY = this.h / (wRows + 1);
                const wSize = Math.min(wGapX * 0.5, wGapY * 0.5, 12);

                for (let r = 0; r < wRows && r < 8; r++) {
                    for (let c = 0; c < wCols && c < 6; c++) {
                        const wx = this.x + (c + 1) * wGapX - wSize / 2 + sx;
                        const wy = this.y + (r + 1) * wGapY - wSize / 2 + sy;
                        const lit = (r + c) % 3 === 0 || (r * 7 + c * 13) % 5 === 0;
                        ctx.fillStyle = lit ? this.windowColor : 'rgba(20,30,50,0.7)';
                        ctx.shadowBlur = lit ? 8 : 0;
                        ctx.shadowColor = this.windowColor + '40';
                        ctx.fillRect(wx, wy, wSize, wSize);
                        ctx.shadowBlur = 0;
                    }
                }

                // Fire effect on building
                if (this.onFire) {
                    ctx.save();
                    const fy = this.y + this.h * 0.2;
                    const fh = this.h * 0.6;
                    for (let i = 0; i < 12; i++) {
                        const fx = this.x + rand(2, this.w - 2) + sx;
                        const ffy = fy + rand(0, fh);
                        const size = rand(4, 16);
                        const alpha = rand(0.3, 0.8) * (1 - this.fireTimer / 120);
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = i % 2 === 0 ? '#ff6b35' : '#ffd93d';
                        ctx.shadowColor = '#ff4400';
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.arc(fx, ffy, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                    this.fireTimer++;
                    if (this.fireTimer > 120) this.onFire = false;
                }
            }

            lightenColor(color, amt) {
                let r = parseInt(color.slice(1, 3), 16),
                    g = parseInt(color.slice(3, 5), 16),
                    b = parseInt(color.slice(5, 7), 16);
                r = Math.min(255, r + amt);
                g = Math.min(255, g + amt);
                b = Math.min(255, b + amt);
                return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
            }

            darkenColor(color, amt) {
                let r = parseInt(color.slice(1, 3), 16),
                    g = parseInt(color.slice(3, 5), 16),
                    b = parseInt(color.slice(5, 7), 16);
                r = Math.max(0, r - amt);
                g = Math.max(0, g - amt);
                b = Math.max(0, b - amt);
                return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                this.shakeX = rand(-4, 4);
                this.shakeY = rand(-4, 4);
                setTimeout(() => { this.shakeX = 0;
                    this.shakeY = 0; }, 150);
                if (this.hp <= 0 && !this.destroyed) {
                    this.destroy();
                    return true;
                }
                return false;
            }

            destroy() {
                if (this.destroyed) return;
                this.destroyed = true;
                this.falling = true;
                this.fallTimer = 0;
                // Spawn debris
                this.spawnDebris();
                // Add score
                const pts = Math.floor(this.maxHp * 10) + 20;
                G.score += pts * (1 + G.combo * 0.1);
                G.score = Math.floor(G.score);
                G.combo++;
                if (G.combo > G.maxCombo) G.maxCombo = G.combo;
                updateHUD();
                // Screen shake
                G.shakeDuration = 12;
                G.shakeX = rand(-6, 6);
                G.shakeY = rand(-6, 6);
                // Particles
                for (let i = 0; i < 30; i++) {
                    G.particles.push({
                        x: this.cx + rand(-this.w / 2, this.w / 2),
                        y: this.cy + rand(-this.h / 2, this.h / 2),
                        vx: rand(-6, 6),
                        vy: rand(-8, 2),
                        life: rand(20, 60),
                        maxLife: 60,
                        size: rand(3, 10),
                        color: ['#ffd866', '#ff6b35', '#ffffff', '#ffb347', '#88ddff'][randInt(0, 4)],
                    });
                }
            }

            spawnDebris() {
                if (this.debrisSpawned) return;
                this.debrisSpawned = true;
                const count = randInt(8, 20);
                for (let i = 0; i < count; i++) {
                    G.debris.push({
                        x: this.cx + rand(-this.w / 2, this.w / 2),
                        y: this.cy + rand(-this.h / 2, this.h / 2),
                        w: rand(4, 14),
                        h: rand(4, 14),
                        vx: rand(-6, 6),
                        vy: rand(-9, 1),
                        rot: rand(0, Math.PI * 2),
                        rotSpeed: rand(-0.1, 0.1),
                        color: this.color,
                        life: rand(40, 100),
                        maxLife: 100,
                        gravity: 0.15,
                    });
                }
            }

            update() {
                if (this.falling) {
                    this.fallTimer++;
                    this.y += 2 + this.fallTimer * 0.08;
                    if (this.y > GROUND_Y + 20) {
                        this.falling = false;
                        this.y = GROUND_Y + 20;
                    }
                }
                if (this.onFire) {
                    this.fireTimer++;
                    if (this.fireTimer > 120) this.onFire = false;
                }
            }
        }

        // ─── Spawn building ───
        function spawnBuilding() {
            if (G.buildings.length >= MAX_BUILDINGS) return;
            const w = rand(35, 70);
            const h = rand(60, 160);
            const x = 950 + rand(0, 80);
            G.buildings.push(new Building(x, w, h));
        }

        // ─── Init ───
        function initGame() {
            G.buildings = [];
            G.particles = [];
            G.debris = [];
            G.fireParticles = [];
            G.score = 0;
            G.combo = 0;
            G.maxCombo = 0;
            G.shakeDuration = 0;
            G.shakeX = 0;
            G.shakeY = 0;
            G.spawnTimer = 0;
            G.frame = 0;
            XZ.x = 200;
            XZ.vx = 0;
            XZ.breathing = false;
            XZ.breathTimer = 0;
            XZ.breathCooldown = 0;
            XZ.walkCycle = 0;
            XZ.facing = 1;
            updateHUD();
            // Initial buildings
            for (let i = 0; i < 8; i++) {
                const x = 150 + i * 100 + rand(-20, 20);
                const w = rand(35, 65);
                const h = rand(60, 150);
                G.buildings.push(new Building(x, w, h));
            }
        }

        // ─── HUD Update ───
        function updateHUD() {
            scoreSpan.textContent = G.score;
            if (G.combo > 0) {
                comboDisplay.classList.add('active');
                comboSpan.textContent = G.combo;
            } else {
                comboDisplay.classList.remove('active');
            }
            buildingCountSpan.textContent = G.buildings.filter(b => !b.destroyed).length;
        }

        // ─── Fire breath ───
        function fireBreath() {
            if (XZ.breathCooldown > 0) return;
            if (XZ.breathing) return;
            XZ.breathing = true;
            XZ.breathTimer = 0;
            XZ.breathCooldown = 20;

            // Check for buildings in front
            const cx = XZ.x + XZ.facing * 50;
            const cy = XZ.y - 30;
            const range = 160;
            let hit = false;

            for (const b of G.buildings) {
                if (b.destroyed) continue;
                const dist = Math.abs(b.cx - cx);
                if (dist < range + b.w / 2 && Math.abs(b.cy - cy) < 80) {
                    const dmg = randInt(2, 5);
                    const destroyed = b.takeDamage(dmg);
                    if (destroyed) {
                        hit = true;
                        // Combo reset if no hit? Actually combo builds on destroy
                    }
                    // Fire particles on building
                    b.onFire = true;
                    b.fireTimer = 0;
                    // Spawn fire particles
                    for (let i = 0; i < 15; i++) {
                        G.fireParticles.push({
                            x: b.cx + rand(-b.w / 2, b.w / 2),
                            y: b.cy + rand(-b.h / 2, b.h / 2),
                            vx: rand(-3, 3),
                            vy: rand(-5, 1),
                            life: rand(10, 30),
                            maxLife: 30,
                            size: rand(4, 14),
                            color: ['#ff6b35', '#ffd93d', '#ff4400', '#ffaa44'][randInt(0, 3)],
                        });
                    }
                }
            }

            if (!hit) {
                // Combo resets if you miss
                G.combo = 0;
                updateHUD();
            }

            // Spawn breath particles
            for (let i = 0; i < 20; i++) {
                const angle = rand(-0.6, 0.6) + (XZ.facing > 0 ? 0 : Math.PI);
                const speed = rand(3, 10);
                G.fireParticles.push({
                    x: XZ.x + XZ.facing * 40 + rand(-10, 10),
                    y: XZ.y - 40 + rand(-20, 20),
                    vx: Math.cos(angle) * speed + XZ.facing * 2,
                    vy: Math.sin(angle) * speed - rand(0, 2),
                    life: rand(8, 25),
                    maxLife: 25,
                    size: rand(5, 18),
                    color: ['#ff6b35', '#ffd93d', '#ff4400', '#ffaa44', '#ffffff'][randInt(0, 4)],
                });
            }

            // Screen shake
            G.shakeDuration = 6;
            G.shakeX = rand(-4, 4);
            G.shakeY = rand(-4, 4);
        }

        // ─── Update ───
        function update() {
            G.frame++;

            // ── Xzilla movement ──
            let move = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) move = -1;
            if (keys['ArrowRight'] || keys['KeyD']) move = 1;

            if (move !== 0) {
                XZ.vx = lerp(XZ.vx, move * XZ.speed, 0.2);
                XZ.facing = move;
                XZ.walkCycle += 0.08;
            } else {
                XZ.vx = lerp(XZ.vx, 0, 0.1);
                XZ.walkCycle *= 0.98;
            }

            XZ.x += XZ.vx;
            XZ.x = clamp(XZ.x, 30, W - 30);

            // ── Breath ──
            if (XZ.breathing) {
                XZ.breathTimer++;
                if (XZ.breathTimer > 25) {
                    XZ.breathing = false;
                    XZ.breathTimer = 0;
                }
            }
            if (XZ.breathCooldown > 0) XZ.breathCooldown--;

            // ── Eye glow ──
            XZ.eyeGlow = 0.5 + 0.5 * Math.sin(G.frame * 0.04);

            // ── Spawn buildings ──
            G.spawnTimer++;
            const spawnRate = Math.max(20, G.spawnInterval - G.frame * 0.002);
            if (G.spawnTimer > spawnRate && G.buildings.length < MAX_BUILDINGS) {
                spawnBuilding();
                G.spawnTimer = 0;
            }

            // ── Update buildings ──
            for (const b of G.buildings) {
                b.update();
            }

            // ── Remove fully destroyed buildings ──
            G.buildings = G.buildings.filter(b => !(b.destroyed && !b.falling) || b.falling);

            // ── Update particles ──
            G.particles = G.particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.life--;
                return p.life > 0;
            });

            G.fireParticles = G.fireParticles.filter(p => {
                p.x += p.vx + rand(-0.2, 0.2);
                p.y += p.vy + rand(-0.2, 0.2);
                p.vy -= 0.05;
                p.life--;
                p.size *= 0.97;
                return p.life > 0 && p.size > 1;
            });

            G.debris = G.debris.filter(d => {
                d.x += d.vx;
                d.y += d.vy;
                d.vy += d.gravity;
                d.rot += d.rotSpeed;
                d.life--;
                return d.life > 0 && d.y < GROUND_Y + 50;
            });

            // ── Screen shake ──
            if (G.shakeDuration > 0) {
                G.shakeDuration--;
                G.shakeX = rand(-4, 4) * (G.shakeDuration / 12);
                G.shakeY = rand(-4, 4) * (G.shakeDuration / 12);
            } else {
                G.shakeX = 0;
                G.shakeY = 0;
            }

            // ── Auto combo decay ──
            if (G.frame % 120 === 0 && G.combo > 0) {
                G.combo = Math.max(0, G.combo - 1);
                updateHUD();
            }

            // ── Update HUD ──
            updateHUD();
        }

        // ─── Draw ───
        function draw() {
            ctx.save();

            // Screen shake
            if (G.shakeDuration > 0) {
                ctx.translate(G.shakeX, G.shakeY);
            }

            // ── Background ──
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGrad.addColorStop(0, '#0a0a2e');
            skyGrad.addColorStop(0.5, '#1a1a3e');
            skyGrad.addColorStop(0.8, '#2a1a3e');
            skyGrad.addColorStop(1, '#1a0a2a');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, GROUND_Y);

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            for (let i = 0; i < 60; i++) {
                const sx = (i * 137.5 + 42) % W;
                const sy = (i * 97.3 + 13) % (GROUND_Y * 0.7);
                const size = (i % 3 === 0) ? 2 : 1;
                const bright = 0.3 + 0.7 * Math.sin(G.frame * 0.02 + i);
                ctx.globalAlpha = bright * 0.6;
                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Moon
            ctx.shadowColor = 'rgba(200,200,255,0.1)';
            ctx.shadowBlur = 60;
            ctx.fillStyle = '#d4d4f0';
            ctx.beginPath();
            ctx.arc(860, 70, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(200,200,255,0.08)';
            ctx.beginPath();
            ctx.arc(870, 60, 55, 0, Math.PI * 2);
            ctx.fill();

            // City silhouette (background)
            ctx.fillStyle = 'rgba(20,15,35,0.5)';
            for (let i = 0; i < 30; i++) {
                const bx = (i * 37 + 11) % W;
                const bw = 12 + (i * 7) % 20;
                const bh = 20 + (i * 13) % 60;
                ctx.fillRect(bx, GROUND_Y - bh, bw, bh);
            }

            // ── Ground ──
            const grd = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            grd.addColorStop(0, '#2a1a1a');
            grd.addColorStop(0.2, '#1a120e');
            grd.addColorStop(1, '#0a0806');
            ctx.fillStyle = grd;
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

            // Ground line glow
            ctx.shadowColor = 'rgba(255,100,50,0.08)';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = 'rgba(255,200,100,0.08)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(W, GROUND_Y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // ── Draw buildings (sorted by y for depth) ──
            const sortedBuildings = [...G.buildings].filter(b => !b.destroyed || b.falling);
            sortedBuildings.sort((a, b) => a.y - b.y);
            for (const b of sortedBuildings) {
                b.draw(ctx);
            }

            // ── Draw debris ──
            for (const d of G.debris) {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rot);
                ctx.globalAlpha = d.life / d.maxLife;
                ctx.fillStyle = d.color;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 6;
                ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
                ctx.restore();
            }

            // ── Draw particles ──
            for (const p of G.particles) {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.shadowColor = p.color + '80';
                ctx.shadowBlur = 15;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // ── Draw fire particles ──
            for (const p of G.fireParticles) {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.shadowColor = '#ff4400';
                ctx.shadowBlur = 30;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // ── Draw Xzilla ──
            drawXzilla();

            // ── Vignette ──
            const vigGrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
            vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
            vigGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = vigGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.restore();
        }

        // ─── Draw Xzilla ───
        function drawXzilla() {
            const x = XZ.x;
            const y = XZ.y;
            const f = XZ.facing;
            const walk = Math.sin(XZ.walkCycle) * 2;
            const breath = XZ.breathing;
            const breathAnim = breath ? Math.sin(XZ.breathTimer * 0.5) * 0.3 + 0.7 : 0;

            ctx.save();
            ctx.translate(x, y);

            // ── Shadow ──
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetY = 6;
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(0, 8, 40, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // ── Tail ──
            ctx.save();
            ctx.translate(-30 * f + 4, 10);
            ctx.rotate(-0.3 * f + Math.sin(G.frame * 0.05) * 0.05);
            ctx.fillStyle = '#2a5a3a';
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.quadraticCurveTo(-30 * f, -18 * f, -50 * f, -4 * f);
            ctx.quadraticCurveTo(-30 * f, 8 * f, 0, 6);
            ctx.fill();
            // Tail spikes
            ctx.fillStyle = '#1a4a2a';
            for (let i = 0; i < 4; i++) {
                const tx = -10 - i * 10 * f;
                const ty = -6 + i * 2;
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(tx - 6 * f, ty - 10);
                ctx.lineTo(tx + 2 * f, ty - 2);
                ctx.fill();
            }
            ctx.restore();

            // ── Body ──
            const bodyGrad = ctx.createRadialGradient(-6 * f, -10, 10, 0, 0, 40);
            bodyGrad.addColorStop(0, '#4a8a5a');
            bodyGrad.addColorStop(0.5, '#2d6a3d');
            bodyGrad.addColorStop(1, '#1a4a2a');
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, 32, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            // Belly
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(60,140,80,0.3)';
            ctx.beginPath();
            ctx.ellipse(4 * f, 8, 18, 22, 0, 0, Math.PI * 2);
            ctx.fill();

            // ── Spikes (back) ──
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.fillStyle = '#1a5a2a';
            for (let i = 0; i < 5; i++) {
                const sx = -18 + i * 9 * f;
                const sy = -32 + i * 6;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + 6 * f, sy - 16 - i * 2);
                ctx.lineTo(sx + 12 * f, sy - 2);
                ctx.fill();
            }

            // ── Head ──
            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            const headX = 28 * f;
            const headY = -28;
            ctx.fillStyle = '#3a7a4a';
            ctx.beginPath();
            ctx.ellipse(headX, headY, 20, 18, 0.2 * f, 0, Math.PI * 2);
            ctx.fill();

            // Jaw
            ctx.fillStyle = '#2a5a3a';
            ctx.beginPath();
            ctx.ellipse(headX + 6 * f, headY + 6, 16, 10, 0.1 * f, 0, Math.PI * 2);
            ctx.fill();

            // ── Eyes ──
            const eyeGlow = XZ.eyeGlow;
            // Left eye (from our perspective)
            ctx.shadowBlur = 25;
            ctx.shadowColor = `rgba(255,80,0,${0.4 + 0.4 * eyeGlow})`;
            ctx.fillStyle = '#ff2200';
            ctx.beginPath();
            ctx.arc(headX + 8 * f, headY - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#ff6611';
            ctx.beginPath();
            ctx.arc(headX + 8 * f, headY - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffcc44';
            ctx.beginPath();
            ctx.arc(headX + 8 * f, headY - 4, 2, 0, Math.PI * 2);
            ctx.fill();

            // Right eye (from our perspective)
            ctx.shadowBlur = 25;
            ctx.shadowColor = `rgba(255,80,0,${0.4 + 0.4 * eyeGlow})`;
            ctx.fillStyle = '#ff2200';
            ctx.beginPath();
            ctx.arc(headX - 2 * f, headY - 6, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#ff6611';
            ctx.beginPath();
            ctx.arc(headX - 2 * f, headY - 6, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffcc44';
            ctx.beginPath();
            ctx.arc(headX - 2 * f, headY - 6, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            // ── Nostrils ──
            ctx.fillStyle = '#1a3a22';
            ctx.beginPath();
            ctx.arc(headX + 14 * f, headY + 2, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(headX + 10 * f, headY + 4, 2, 0, Math.PI * 2);
            ctx.fill();

            // ── Arms ──
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.fillStyle = '#3a7a4a';
            const armSwing = breath ? Math.sin(XZ.breathTimer * 0.3) * 0.5 : 0;
            // Left arm
            ctx.save();
            ctx.translate(-16, 4);
            ctx.rotate(-0.4 * f + armSwing * 0.2);
            ctx.fillRect(-3, 0, 6, 22);
            // Claws
            ctx.fillStyle = '#2a5a3a';
            for (let i = 0; i < 3; i++) {
                ctx.fillRect(-4 + i * 4, 20, 3, 6);
            }
            ctx.restore();
            // Right arm
            ctx.save();
            ctx.translate(16, 4);
            ctx.rotate(0.4 * f - armSwing * 0.2);
            ctx.fillStyle = '#3a7a4a';
            ctx.fillRect(-3, 0, 6, 22);
            ctx.fillStyle = '#2a5a3a';
            for (let i = 0; i < 3; i++) {
                ctx.fillRect(-4 + i * 4, 20, 3, 6);
            }
            ctx.restore();

            // ── Legs ──
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.fillStyle = '#2d6a3d';
            const legOff = walk * 2;
            // Left leg
            ctx.fillRect(-12, 30 + legOff * 0.5, 8, 18 + legOff * 0.3);
            // Right leg
            ctx.fillRect(4, 30 - legOff * 0.5, 8, 18 - legOff * 0.3);
            // Feet
            ctx.fillStyle = '#1a4a2a';
            ctx.fillRect(-14, 48 + legOff * 0.5, 12, 6);
            ctx.fillRect(2, 48 - legOff * 0.5, 12, 6);

            // ── Breath effect ──
            if (breath) {
                ctx.shadowBlur = 60;
                ctx.shadowColor = 'rgba(255,80,0,0.5)';
                const grad = ctx.createRadialGradient(
                    40 * f, -20, 5,
                    40 * f + 40 * f, -20, 80
                );
                grad.addColorStop(0, `rgba(255,200,80,${0.5 * breathAnim})`);
                grad.addColorStop(0.3, `rgba(255,100,30,${0.4 * breathAnim})`);
                grad.addColorStop(0.7, `rgba(200,50,10,${0.2 * breathAnim})`);
                grad.addColorStop(1, 'rgba(200,50,10,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(40 * f + 30 * f, -20, 60 + 30 * breathAnim, 25 + 15 * breathAnim, 0.1 * f, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // ─── Input ───
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                fireBreath();
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        canvas.addEventListener('click', (e) => {
            fireBreath();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            fireBreath();
        });

        // ─── Resize ───
        function resizeCanvas() {
            const container = canvas.parentElement;
            const containerWidth = container.clientWidth;
            if (containerWidth > 0 && containerWidth < 1000) {
                canvas.style.width = containerWidth + 'px';
                canvas.style.height = (containerWidth * 0.6) + 'px';
            } else {
                canvas.style.width = '';
                canvas.style.height = '';
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 50);

        // ─── Game Loop ───
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // ─── Start ───
        initGame();
        loop();

        // ─── Expose for debugging ───
        console.log('🦎 Xzilla City Destruction loaded!');
        console.log('Controls: ← → move | Space/Click to destroy!');
    </script>

</body>
