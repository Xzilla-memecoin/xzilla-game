<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>XZILLA: 3D Scam Destroyer</title>

<!-- ============================================================
     XZILLA: 3D SCAM DESTROYER
     Single-file Three.js arcade game for Telegram Mini Apps.
     Slide Xzilla, DESTROY scammers (+points), PROTECT holders.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#0a0613;        /* deep background        */
    --void2:#140a26;       /* gradient stop          */
    --toxic:#39ff7a;       /* Xzilla radioactive green */
    --magenta:#ff2bd6;     /* danger / hot accent    */
    --cyan:#21e6ff;        /* UI cyan                */
    --gold:#ffd23f;        /* VIP gold               */
    --danger:#ff3b5c;      /* lose life red          */
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#000;
    overscroll-behavior:none; touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  #game{ position:fixed; inset:0; }
  #fatal{ position:fixed; top:0; left:0; right:0; z-index:999; display:none;
    background:#1a0008; color:#ff6b81; font:12px/1.5 ui-monospace,monospace; padding:14px;
    white-space:pre-wrap; border-bottom:2px solid #ff3b5c; }
  canvas{ display:block; }
  #game canvas{ width:100% !important; height:100% !important; display:block; }

  /* ---- CRT / scanline overlay (the signature look) ---- */
  #crt{
    position:fixed; inset:0; pointer-events:none; z-index:30;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.16) 3px,
        rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:29;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.65) 100%);
  }

  /* ---- HUD ---- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 16px; pointer-events:none;
    font-family:'Orbitron',sans-serif; color:#fff;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .hud-block{ display:flex; flex-direction:column; gap:4px; }
  .hud-right{ align-items:flex-end; }
  .hud-label{ font-size:9px; letter-spacing:2px; opacity:.6; }
  #score{ font-size:26px; font-weight:900; color:var(--cyan); text-shadow:0 0 12px var(--cyan); line-height:1; }
  #lives{ font-size:20px; letter-spacing:2px; }
  #combo{
    font-family:'Press Start 2P'; font-size:11px; color:var(--toxic);
    text-shadow:0 0 10px var(--toxic); opacity:0; transition:opacity .15s;
  }
  #vipBadge{
    display:none; margin-top:6px; font-family:'Press Start 2P'; font-size:8px;
    color:var(--gold); border:1px solid var(--gold); border-radius:4px;
    padding:4px 6px; text-shadow:0 0 8px var(--gold); box-shadow:0 0 12px rgba(255,210,63,.4);
    animation:vipPulse 1.4s ease-in-out infinite;
  }
  @keyframes vipPulse{ 0%,100%{box-shadow:0 0 8px rgba(255,210,63,.3)} 50%{box-shadow:0 0 20px rgba(255,210,63,.7)} }

  /* ---- floating score popups ---- */
  #popups{ position:fixed; inset:0; z-index:22; pointer-events:none; }
  .popup{
    position:absolute; transform:translate(-50%,-50%);
    font-family:'Press Start 2P'; font-size:13px; white-space:nowrap;
    animation:floatUp .9s ease-out forwards; text-shadow:0 0 8px currentColor;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.6); }
    20%{ opacity:1; transform:translate(-50%,-70%) scale(1.1); }
    100%{ opacity:0; transform:translate(-50%,-140%) scale(1); }
  }

  /* ---- wave banner ---- */
  #banner{
    position:fixed; top:38%; left:0; right:0; text-align:center; z-index:23;
    font-family:'Press Start 2P'; font-size:20px; color:var(--magenta);
    text-shadow:0 0 18px var(--magenta); opacity:0; pointer-events:none;
  }
  .banner-show{ animation:bannerFlash 1.3s ease-out forwards; }
  @keyframes bannerFlash{
    0%{opacity:0;transform:scale(.6)} 20%{opacity:1;transform:scale(1.15)}
    70%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.4)}
  }

  /* ---- overlay screens ---- */
  .overlay{
    position:fixed; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:radial-gradient(ellipse at 50% 30%, var(--void2) 0%, var(--void) 70%, #000 100%);
    font-family:'Orbitron',sans-serif; color:#fff;
  }
  .hidden{ display:none !important; }

  #heroImg{ width:200px; max-width:58vw; height:auto; margin-bottom:2px;
    filter:drop-shadow(0 0 26px rgba(57,255,122,.6)) drop-shadow(0 0 10px rgba(0,0,0,.55));
    animation:heroFloat 3.2s ease-in-out infinite; }
  @keyframes heroFloat{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  .logo{
    font-family:'Press Start 2P'; line-height:1.5; margin-bottom:8px;
  }
  .logo .x{ font-size:34px; color:var(--toxic); text-shadow:0 0 18px var(--toxic),0 0 4px #fff; display:block; }
  .logo .sub{ font-size:12px; color:var(--magenta); text-shadow:0 0 10px var(--magenta); display:block; margin-top:10px; }

  .tag{ font-size:12px; letter-spacing:1px; opacity:.8; max-width:300px; margin:14px 0 26px; line-height:1.6; }
  .tag b.good{ color:var(--magenta); }
  .tag b.bad{ color:var(--cyan); }

  .btn{
    font-family:'Press Start 2P'; font-size:13px; letter-spacing:1px;
    color:#04130a; background:var(--toxic); border:none; border-radius:10px;
    padding:18px 26px; cursor:pointer; pointer-events:auto;
    box-shadow:0 0 22px rgba(57,255,122,.55), inset 0 -4px 0 rgba(0,0,0,.25);
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(2px) scale(.98); }
  .btn.secondary{ background:transparent; color:var(--cyan); border:2px solid var(--cyan); box-shadow:0 0 16px rgba(33,230,255,.4); }
  .btn:disabled{ opacity:.5; }

  .wallet{
    margin-top:18px; font-size:10px; letter-spacing:1px; min-height:16px;
    font-family:'Orbitron'; color:var(--cyan); opacity:.9; word-break:break-all; max-width:300px;
  }
  .status-line{ margin-top:8px; font-size:10px; color:var(--gold); min-height:14px; }

  /* game over stats */
  .go-title{ font-family:'Press Start 2P'; font-size:24px; color:var(--danger); text-shadow:0 0 16px var(--danger); margin-bottom:22px; }
  .stat{ font-size:13px; margin:6px 0; letter-spacing:1px; }
  .stat .num{ color:var(--cyan); font-weight:900; font-size:20px; text-shadow:0 0 10px var(--cyan); }
  .best{ color:var(--gold); }
  .go-buttons{ display:flex; flex-direction:column; gap:12px; margin-top:26px; }

  #muteBtn{
    position:fixed; z-index:25; right:14px; bottom:calc(14px + env(safe-area-inset-bottom));
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.25);
    background:rgba(10,6,19,.6); color:#fff; font-size:18px; pointer-events:auto; cursor:pointer;
  }
  .blink{ animation:blink 1s steps(2,start) infinite; }
  @keyframes blink{ 50%{opacity:.25} }
</style>
</head>

  <div id="vignette"></div>
  <div id="crt"></div>

    </div>
  </div>

  <div id="popups"></div>
  <div id="banner"></div>
  <button id="muteBtn" class="hidden">🔊</button>
