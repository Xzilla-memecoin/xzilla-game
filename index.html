<style>

  /* toast */
  .xz-toast{ position:fixed; left:50%; top:84px; transform:translate(-50%,-12px); z-index:60;

  .xz-toast.show{ opacity:1; transform:translate(-50%,0); }

  /* mega NO MERCY banner */
  #banner.mega{ font-size:34px; color:var(--toxic);
    text-shadow:3px 3px 0 var(--magenta), 6px 6px 0 #5a1a8a, 0 0 26px var(--toxic); }
</style>

<script>
/* ============================================================
   CONFIG  ── paste your own values here
   ============================================================ */
const XZILLA_BACK_IMAGE_URL = "https://raw.githubusercontent.com/Xzilla-memecoin/xzilla-game/main/images/Xrider.webp";
// Bad guys / holders are drawn procedurally for now. Paste your own
// CORS-enabled PNG URLs here later and they'll override the art:
const ASSET_BASE = "https://raw.githubusercontent.com/Xzilla-memecoin/xzilla-game/main/images/";
const HOLDER_IMAGE_URL  = ASSET_BASE + "hodler.webp";

/* ----- optional custom audio -------------------------------------------- *
 * Paste direct URLs (mp3/ogg/wav — same hosting trick as the images above:
 * e.g. upload to the GitHub repo under an "audio/" folder and use the raw
 * URL) to replace the built-in synthesized music/engine with your own
 * recordings or Suno-generated tracks. Both should be seamless loops.
 * Leave either one "" to keep the synthesized version for that slot. ----- */
const MUSIC_URL  = "";   // 🎵 your own looping background track
const ENGINE_URL = "";   // 🏍 your own looping motorcycle engine sound

const XZILLA_MINT_ADDRESS = "YOUR_XZILLA_MINT_ADDRESS_HERE";
const SOLANA_RPC          = "https://api.mainnet-beta.solana.com";
const FORCE_VIP_FOR_DEMO  = true;

const CFG = { lives:3, baseSpeed:9, speedRampPerSec:0.18, baseSpawnGap:0.92, minSpawnGap:0.34,
  holderChance:0.32, powerupChance:0.05, scammerPoints:10, vipMultiplier:1.2, playerSpeedLerp:0.22 };

/* ============================================================ STATE */
const state = { running:false, score:0, lives:CFG.lives, combo:0, kills:0, wave:1, vip:false, best:0,
  speed:CFG.baseSpeed, spawnGap:CFG.baseSpawnGap, spawnTimer:0, elapsed:0, playerTargetX:0, shake:0, soundOn:true };
try { state.best = parseInt(localStorage.getItem("xzilla_best")||"0",10)||0; } catch(e){}

/* ============================================================ TELEGRAM */
let tg=null;
try{ tg = (window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
  if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor&&tg.setHeaderColor("#070318"); tg.setBackgroundColor&&tg.setBackgroundColor("#070318"); }
}catch(e){}

/* ============================================================ AUDIO (music + sfx, fully synthesized) */
let actx=null, masterGain=null, musicGain=null, sfxGain=null;
let customMusicBuffer=null, customEngineBuffer=null;
(function preloadCustomAudio(){
  function load(url, assign){
    if(!url) return;
    try{
      const decodeCtx = new (window.AudioContext||window.webkitAudioContext)();
      fetch(url).then(r=>r.arrayBuffer()).then(buf=>decodeCtx.decodeAudioData(buf)).then(decoded=>{
        assign(decoded); try{ decodeCtx.close(); }catch(_){}
      }).catch(()=>{ /* bad URL/format — silently keep the built-in synth sound */ });
    }catch(e){}
  }
  load(MUSIC_URL,  b=>customMusicBuffer=b);
  load(ENGINE_URL, b=>customEngineBuffer=b);
})();
function audioInit(){
  try{
    if(!actx){
      actx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=actx.createGain(); masterGain.gain.value=state.soundOn?1:0; masterGain.connect(actx.destination);
      musicGain=actx.createGain();  musicGain.gain.value=0.30; musicGain.connect(masterGain);
      sfxGain=actx.createGain();    sfxGain.gain.value=0.9;  sfxGain.connect(masterGain);
    }
    if(actx.state==="suspended") actx.resume();
  }catch(e){}
}
/* ---- V2 (V-twin) engine: looping uneven-fire exhaust pulses ---- */
let engine=null;
function buildVTwinBuffer(){
  // one full crank cycle: two firing pulses unevenly spaced (Harley-style 315/405 deg)
  const sr=actx.sampleRate, cyc=0.5, len=(sr*cyc)|0;
  const buf=actx.createBuffer(1,len,sr), d=buf.getChannelData(0);
  const fires=[0.0, 0.4375];        // uneven gap -> potato-potato lope
  for(const f of fires){
    const start=(f*len)|0, dur=(0.13*sr)|0;
    for(let i=0;i<dur && start+i<len;i++){
      const env=Math.exp(-i/(0.018*sr));            // sharp thump decay

const PROG=[ {b:55.00,t:[220.00,261.63,329.63]}, {b:43.65,t:[174.61,220.00,261.63]},

function mVoice(type,freq,t,dur,vol,lpf){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=freq; let node=o;
  if(lpf){ const f=actx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lpf; o.connect(f); node=f; }
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); node.connect(g); g.connect(musicGain);

}
function mKick(t){ const o=actx.createOscillator(), g=actx.createGain();
  o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);

  const g=actx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

const isTouchDevice = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
const hasOrientation = typeof window.DeviceOrientationEvent !== "undefined";
let tiltEnabled = false, tiltCenter = null;
const TILT_SENSITIVITY = 0.16; // world-units per degree of tilt past center; tune to taste

function onTilt(e){
  if(!tiltEnabled || !state.running || dragging) return;     // a finger-drag always wins while it's active
  const g = e.gamma; if(g===null || g===undefined) return;    // some devices report null before first real reading
  if(tiltCenter===null){ tiltCenter=g; return; }               // first reading after enabling = "neutral" pose
  const delta = g - tiltCenter;
  state.playerTargetX = THREE.MathUtils.clamp(delta*TILT_SENSITIVITY, -playHalfWidth, playHalfWidth);
}
function setTiltLabel(){ if(tiltBtn) tiltBtn.textContent = "🎮 TILT: " + (tiltEnabled?"ON":"OFF"); }
function enableTilt(){
  window.addEventListener("deviceorientation", onTilt);
  tiltEnabled = true; tiltCenter = null; setTiltLabel();
  if(tiltBtn) tiltBtn.classList.add("on");
}
function disableTilt(){
  tiltEnabled = false; setTiltLabel();
  if(tiltBtn) tiltBtn.classList.remove("on");
}
if(tiltBtn && isTouchDevice && hasOrientation){
  tiltBtn.classList.remove("hidden");
  tiltBtn.addEventListener("click", async ()=>{
    if(tiltEnabled){ disableTilt(); return; }
    // iOS 13+ requires an explicit permission grant from a real tap — this click is that tap.
    try{
      if(typeof DeviceOrientationEvent.requestPermission === "function"){
        const res = await DeviceOrientationEvent.requestPermission();
        if(res === "granted") enableTilt(); else toast("Tilt permission denied",RED);
      } else { enableTilt(); }
    }catch(e){ toast("Tilt unavailable on this device",RED); }
  });
}

window.addEventListener("keydown",e=>{ if(!state.running) return;
  if(e.key==="ArrowLeft") state.playerTargetX=Math.max(-playHalfWidth,state.playerTargetX-playHalfWidth*0.22);
  if(e.key==="ArrowRight") state.playerTargetX=Math.min(playHalfWidth,state.playerTargetX+playHalfWidth*0.22); });

/* ============================================================ EFFECTS */
const particles=[];
const partMat=new THREE.SpriteMaterial({ map:radialGlow("#ffffff"), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
function burst(x,y,z,color,count){ for(let i=0;i<count;i++){ const m=partMat.clone(); m.color=new THREE.Color(color);
  const s=new THREE.Sprite(m); s.scale.set(0.8,0.8,1); s.position.set(x,y,z); scene.add(s);
  particles.push({sprite:s,vx:(Math.random()-0.5)*9,vy:(Math.random()-0.5)*9,vz:(Math.random()-0.5)*7,life:0.65}); } }
function updateParticles(dt){ for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt;
  p.sprite.position.x+=p.vx*dt; p.sprite.position.y+=p.vy*dt; p.sprite.position.z+=p.vz*dt;
  const k=Math.max(p.life/0.65,0); p.sprite.material.opacity=k; p.sprite.scale.setScalar(0.8*k+0.15);
  if(p.life<=0){ scene.remove(p.sprite); p.sprite.material.dispose(); particles.splice(i,1); } } }
const popupsEl=document.getElementById("popups");
function popup(worldPos,text,color){ const v=worldPos.clone().project(camera);
  const sx=(v.x*0.5+0.5)*window.innerWidth, sy=(-v.y*0.5+0.5)*window.innerHeight;
  const el=document.createElement("div"); el.className="popup"; el.textContent=text; el.style.left=sx+"px"; el.style.top=sy+"px"; el.style.color=color;
  popupsEl.appendChild(el); setTimeout(()=>el.remove(),900); }
function shake(a){ state.shake=Math.max(state.shake,a); }
function footPuff(){ const px=player.position.x;
  for(let i=0;i<2;i++){ const m=partMat.clone(); m.color=new THREE.Color("#cbb8ff");
    const s=new THREE.Sprite(m); s.scale.set(0.5,0.5,1); s.position.set(px+(Math.random()-0.5)*0.7,-0.3,PLAYER_Z+0.4); scene.add(s);
    particles.push({sprite:s,vx:(Math.random()-0.5)*1.6,vy:Math.random()*1.0+0.2,vz:2+Math.random()*2,life:0.4}); } }
function flashColor(c,a){ const f=document.createElement("div");
  f.style.cssText="position:fixed;inset:0;z-index:24;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,"+c+" 100%);opacity:"+a+";transition:opacity .3s;";
  document.body.appendChild(f); requestAnimationFrame(()=>{ f.style.opacity="0"; }); setTimeout(()=>f.remove(),320); }

/* ============================================================ HUD */
const el={ score:document.getElementById("score"), lives:document.getElementById("lives"), combo:document.getElementById("combo"),
  hud:document.getElementById("hud"), vipBadge:document.getElementById("vipBadge"), banner:document.getElementById("banner"), sound:document.getElementById("soundBtn") };
function renderLives(){ el.lives.textContent="🟢".repeat(Math.max(state.lives,0))+"⚫".repeat(Math.max(CFG.lives-state.lives,0)); }
function renderScore(){ el.score.textContent=Math.floor(state.score); }
function renderCombo(){ if(state.combo>1){ el.combo.textContent="COMBO x"+state.combo; el.combo.style.opacity="1"; } else el.combo.style.opacity="0"; }
function showBanner(t){ el.banner.textContent=t; el.banner.classList.remove("banner-show"); void el.banner.offsetWidth; el.banner.classList.add("banner-show"); }

/* ============================================================ SCORING / COLLISIONS */
function addScore(base,worldPos){ const mult=(state.combo>1?state.combo:1)*(state.vip?CFG.vipMultiplier:1); const gain=Math.round(base*mult);
  state.score+=gain; renderScore(); popup(worldPos,"+"+gain,state.vip?"#ffd23f":"#39ff7a");
  const nw=1+Math.floor(state.score/150); if(nw>state.wave){ state.wave=nw; sfx.wave(); showBanner("WAVE "+state.wave); } }
function loseLife(worldPos){ state.lives--; state.combo=0; renderCombo(); renderLives(); sfx.hit(); shake(1.0); flashColor("rgba(255,59,92,.55)",0.8);
  if(worldPos) popup(worldPos,"-1 HP","#ff3b5c"); if(tg&&tg.HapticFeedback){ try{ tg.HapticFeedback.notificationOccurred("error"); }catch(e){} }
  if(state.lives<=0) gameOver(); }
let shieldActive=false;
function resolve(e){ const p=e.sprite.position.clone();
  if(e.type===TYPE.SCAMMER){ state.combo++; state.kills++; sfx.catch(state.combo); burst(p.x,p.y,p.z,SCAMMERS[0].c1,11); addScore(CFG.scammerPoints,p); renderCombo();
    pop=1.22; if(state.combo>0&&state.combo%5===0){ showBanner(state.combo+" COMBO!"); flashColor("rgba(57,255,122,.35)",0.5); }
    if(tg&&tg.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred("light"); }catch(e){} } }
  else if(e.type===TYPE.HOLDER){ if(shieldActive){ shieldActive=false; burst(p.x,p.y,p.z,"#39ff7a",12); popup(p,"BLOCKED!","#39ff7a"); sfx.power(); } else loseLife(p); }
  else if(e.type===TYPE.SHIELD){ shieldActive=true; burst(p.x,p.y,p.z,"#39ff7a",12); popup(p,"SHIELD!","#39ff7a"); sfx.power(); }
  else if(e.type===TYPE.BOMB){ sfx.power(); burst(p.x,p.y,p.z,"#ffd23f",18); shake(0.6); flashColor("rgba(255,210,63,.4)",0.6); popup(p,"LIQUIDATED!","#ffd23f");
    for(let i=active.length-1;i>=0;i--){ const a=active[i]; if(a!==e&&a.type===TYPE.SCAMMER&&!a.dead){ a.dead=true; const ap=a.sprite.position.clone(); burst(ap.x,ap.y,ap.z,"#ff2bd6",6); state.kills++; addScore(CFG.scammerPoints,ap); freeEntity(a);} } }
  e.dead=true; freeEntity(e); }

/* ============================================================ MAIN LOOP */
const clock=new THREE.Clock(); let gridOffset=0;
function loop(){ requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),0.05); const now=performance.now()*0.001;
  const scroll=dt*(state.running?state.speed:3.5); gridOffset=(gridOffset+scroll)%2; grid.position.z=-6+gridOffset; grid2.position.z=-6+gridOffset;
  const since=actx?(actx.currentTime-beatT):9, pulse=Math.max(0,1-since*6);
  grid.material.opacity=0.5+0.32*pulse; grid2.material.opacity=0.16+0.18*pulse;
  sunGlow.material.opacity=0.5+0.4*pulse; sunGlow.scale.setScalar(66+10*pulse);
  if(state.vip){ vipGlow.material.opacity=0.42+0.26*Math.sin(now*4.4); vipGlow.scale.setScalar(4.4+0.3*Math.sin(now*4.4)); }
  vipGlow.position.x=player.position.x; vipGlow.position.y=player.position.y;
  const vx=player.position.x-prevPX; prevPX=player.position.x; const moving=Math.abs(vx)>0.002;
  const cadence=state.running?(moving?17:12):9; runPhase+=dt*cadence;
  // chopper idle vibration (no jumping): tiny high-freq jitter on y + scale
  const vib=state.running?(Math.sin(now*47)*0.012+Math.sin(now*83)*0.006):0;
  player.position.y=0.9+vib;
  const sx=1+vib*0.4, sy=1-vib*0.4; pop+=(1-pop)*0.18;
  player.scale.set(3.0*sx*pop, 3.0*sy*pop, 1);
  // chopper bank: steer intent (target vs pos) + velocity, smoothed
  const steer=(state.playerTargetX-player.position.x);
  const want=-(steer*0.30+vx*7); const targetLean=Math.max(-0.5,Math.min(0.5,want));
  lean+=(targetLean-lean)*0.14;
  player.material.rotation=lean+vib*0.5;
  if(typeof setEnginePitch==="function") setEnginePitch(Math.abs(vx));

  if(state.running){
    state.elapsed+=dt; state.speed=CFG.baseSpeed+state.elapsed*CFG.speedRampPerSec; state.spawnGap=Math.max(CFG.minSpawnGap,CFG.baseSpawnGap-state.elapsed*0.012);
    player.position.x+=(state.playerTargetX-player.position.x)*CFG.playerSpeedLerp; player.position.x=THREE.MathUtils.clamp(player.position.x,-playHalfWidth,playHalfWidth);
    state.spawnTimer-=dt; if(state.spawnTimer<=0){ spawn(); state.spawnTimer=state.spawnGap*(0.7+Math.random()*0.6); }
    const catchX=1.85, catchZ=1.6;
    for(let i=active.length-1;i>=0;i--){ const e=active[i]; if(e.dead) continue; e.prevZ=e.sprite.position.z; e.sprite.position.z+=state.speed*dt; const z=e.sprite.position.z;
      if(e.prevZ<PLAYER_Z+catchZ && z>=PLAYER_Z-catchZ){ if(Math.abs(e.sprite.position.x-player.position.x)<catchX){ resolve(e); continue; } }
      if(z>CAM.z+1){ if(e.type===TYPE.SCAMMER){ state.combo=0; renderCombo(); } freeEntity(e); } } }

  updateParticles(dt);
  const bob=pulse*0.10; if(state.shake>0.001){ const s=state.shake; placeCamera((Math.random()-0.5)*s,(Math.random()-0.5)*s*0.6+bob); state.shake*=0.86; } else placeCamera(0,bob);
  if(window.__frame) window.__frame(dt);
  if(window.__composer) window.__composer.render(); else renderer.render(scene,camera); }
loop();

/* ============================================================ GAME FLOW */
function resetGame(){ for(let i=active.length-1;i>=0;i--) freeEntity(active[i]);
  Object.assign(state,{score:0,lives:CFG.lives,combo:0,kills:0,wave:1,speed:CFG.baseSpeed,spawnGap:CFG.baseSpawnGap,spawnTimer:0,elapsed:0,playerTargetX:0,shake:0});
  shieldActive=false; player.position.x=0; renderScore(); renderLives(); renderCombo(); }
function startGame(){ audioInit(); startMusic(); startEngine(); resetGame();
  document.getElementById("startScreen").classList.add("hidden"); document.getElementById("gameOverScreen").classList.add("hidden");
  document.getElementById("pauseScreen").classList.add("hidden");
  el.hud.classList.remove("hidden"); el.sound.classList.remove("hidden"); el.vipBadge.style.display=state.vip?"inline-block":"none"; vipGlow.material.opacity=0; state.running=true;
  document.getElementById("pauseBtn").classList.remove("hidden"); }
function gameOver(){ state.running=false; stopEngine(); sfx.over();
  if(state.score>state.best){ state.best=Math.floor(state.score); try{ localStorage.setItem("xzilla_best",String(state.best)); }catch(e){} }
  document.getElementById("finalScore").textContent=Math.floor(state.score); document.getElementById("finalKills").textContent=state.kills;
  document.getElementById("bestScore").textContent=state.best; document.getElementById("gameOverScreen").classList.remove("hidden"); el.hud.classList.add("hidden");
  document.getElementById("pauseBtn").classList.add("hidden"); }

/* ============================================================ PAUSE */
let isPaused = false;
function pauseGame(){
  if(!state.running || isPaused) return;
  isPaused = true; state.running = false;
  try{ if(actx && actx.state==="running") actx.suspend(); }catch(e){}   // freezes music + engine + sfx in place
  document.getElementById("pauseScreen").classList.remove("hidden");
}
function resumeGame(){
  if(!isPaused) return;
  isPaused = false; state.running = true;
  try{ if(actx && actx.state==="suspended") actx.resume(); }catch(e){}
  document.getElementById("pauseScreen").classList.add("hidden");
}
function quitToMenu(){
  isPaused = false; state.running = false;
  try{ if(actx && actx.state==="suspended") actx.resume(); }catch(e){}
  stopEngine();
  document.getElementById("pauseScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");
  el.hud.classList.add("hidden"); document.getElementById("pauseBtn").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
}
document.getElementById("pauseBtn").addEventListener("click",pauseGame);
document.getElementById("resumeBtn").addEventListener("click",resumeGame);
document.getElementById("quitBtn").addEventListener("click",quitToMenu);
window.addEventListener("keydown",e=>{ if(e.key==="Escape"||e.key===" "){
  if(isPaused) resumeGame(); else if(state.running) pauseGame(); } });

/* ============================================================ WALLET + TOKEN CHECK */
function shortKey(k){ return k.slice(0,4)+"…"+k.slice(-4); }
async function checkTokenBalance(connection,ownerPubkeyStr,mint){ try{
  if(!window.solanaWeb3||/YOUR_/.test(mint)) return 0;
  const owner=new solanaWeb3.PublicKey(ownerPubkeyStr), mintKey=new solanaWeb3.PublicKey(mint);
  const res=await connection.getParsedTokenAccountsByOwner(owner,{mint:mintKey}); let total=0;
  res.value.forEach(a=>{ total+=a.account.data.parsed.info.tokenAmount.uiAmount||0; }); return total; }catch(e){ return 0; } }
async function connectWallet(){ audioInit();
  const info=document.getElementById("walletInfo"), vipEl=document.getElementById("vipStatus"),
    startBtn=document.getElementById("startBtn"), connectBtn=document.getElementById("connectBtn");
  info.textContent="Connecting…"; info.classList.add("blink"); let pubkey=null;
  try{ if(window.solana&&window.solana.isPhantom){ const r=await window.solana.connect(); pubkey=r.publicKey.toString(); } }catch(e){}
  if(!pubkey){ try{ pubkey=solanaWeb3.Keypair.generate().publicKey.toString(); }catch(e){ pubkey="MockWa11et"+Math.random().toString(36).slice(2,10); } }
  info.classList.remove("blink"); info.textContent="✔ "+shortKey(pubkey); connectBtn.classList.add("hidden");
  vipEl.textContent="Checking $XZILLA balance…"; let balance=0;
  try{ const conn=new solanaWeb3.Connection(SOLANA_RPC,"confirmed"); balance=await checkTokenBalance(conn,pubkey,XZILLA_MINT_ADDRESS); }catch(e){}
  state.vip = balance>0 || FORCE_VIP_FOR_DEMO;
  if(state.vip){ el.vipBadge.style.display="inline-block"; vipEl.style.color="#ffd23f";
    vipEl.textContent = balance>0 ? ("★ VIP HODLER — "+balance.toLocaleString()+" $XZILLA · 1.2x") : "★ VIP HODLER unlocked (demo) · 1.2x score"; }
  else { vipEl.style.color="#9fb6c9"; vipEl.textContent="No $XZILLA found — standard mode"; }
  }

/* ============================================================ WIRING */
document.getElementById("connectBtn").addEventListener("click",connectWallet);
document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("retryBtn").addEventListener("click",startGame);
el.sound.addEventListener("click",()=>{ state.soundOn=!state.soundOn; el.sound.textContent=state.soundOn?"🔊":"🔇"; audioInit(); if(masterGain) masterGain.gain.value=state.soundOn?1:0; });
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&state.running) pauseGame(); });
document.getElementById("bestScore").textContent=state.best;
</script>

(function(){

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12,0.16,trunkH,6),

    trunk.position.y = trunkH/2; g.add(trunk);
    const tiers = 3, baseR = 0.85 + Math.random()*0.25;
    const leafColor = Math.random()>0.5 ? 0x1f8a4a : 0x16cf7a;
    for(let i=0;i<tiers;i++){
      const r = baseR * (1 - i*0.26);
      const h = 1.3 - i*0.18;
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(r,h,7),
        new THREE.MeshBasicMaterial({ color:leafColor }));
      cone.position.y = trunkH + i*0.62 + h*0.42;

    } else if(r<CFG.powerupChance+CFG.holderChance){

  /* ------------------------- per-frame world hook ------------------------- */
  window.__frame = function(dt){
    const now=performance.now()*0.001;
    const sp=(state.running?state.speed:3.5)*dt;
    for(const py of pylons){ py.position.z+=sp; if(py.position.z>CAM.z+3) py.position.z-=PYL_SPAN; }
    for(const b of skyline){ b.position.z+=sp; if(b.position.z>CAM.z+5) b.position.z-=SKY_SPAN; }
    floorTex.offset.y = (floorTex.offset.y - sp*0.012)%1;
    // boss flair
    for(const a of active){ if(a.type===TYPE.BOSS){
      a.sprite.position.x = Math.sin(now*2)*0.7;
      a.sprite.material.rotation = Math.sin(now*3)*0.05; } }
    // shadow follows player
    try { shadow.position.x = player.position.x;
      const s = 2.6 + (player.position.y-0.9)*0.0 ; shadow.material.opacity = 0.7 - (player.position.y-0.9)*0.5;
      shadow.scale.x = 3 - (player.position.y-0.9)*0.6; } catch(e){}

  /* ========================================================================== *
   *  SET 2 — DEPTH UPDATE                                                       *
   *  Adds: new enemy archetypes, wave structure, power-ups, an upgrade tree     *
   *  spent in XP, tier effects that actually bite, real skin art, and a         *
   *  structured leaderboard. Defined last so its spawn/resolve/__frame/addScore *
   *  overrides win. Everything reuses in-scope helpers from the layers above.   *
   * ========================================================================== */
  (function(){
    if (typeof THREE === "undefined") return;

    /* ----- new entity type ids (extend, don't clobber) ---------------------- */
    TYPE.HONEYPOT = 5;   // looks catchable, costs a life if you grab it
    TYPE.DECOY    = 6;   // fake airdrop — grabbing it kills your combo
    TYPE.RUGBOSS  = 7;   // multi-hit boss with a health bar
    TYPE.PWR_SLOW = 8;   // slow-mo
    TYPE.PWR_X2   = 9;   // double score window
    TYPE.PWR_MAG  = 10;  // scammer magnet

    /* ----- upgrade tree (persisted, spent in XP) ----------------------------- */
    const UPGRADES = [
      {id:"hp",    name:"REINFORCED SCALES", desc:"+1 max HP per level",       max:3, base:4000,  step:2.4},
      {id:"combo", name:"DIAMOND GRIP",      desc:"Wider combo window",        max:4, base:2500,  step:2.0},
      {id:"drop",  name:"DEGEN LUCK",        desc:"+15% XP per kill / lvl",max:4, base:3000,  step:2.1},
      {id:"pwr",   name:"POWER MAGNET",      desc:"Power-ups spawn more often", max:3, base:5000,  step:2.6},
      {id:"start", name:"HEAD START",        desc:"Begin each run with a shield",max:1, base:8000,  step:1}
    ];
    let upg = store.get("xz_upg", null);
    if(!upg || typeof upg!=="object"){ upg={}; }
    UPGRADES.forEach(u=>{ if(typeof upg[u.id]!=="number") upg[u.id]=0; });
    function saveUpg(){ store.set("xz_upg", upg); }
    function upgCost(u){ return Math.round(u.base * Math.pow(u.step, upg[u.id])); }
    function lvl(id){ return upg[id]||0; }

    /* apply persistent upgrades to CFG/run baselines ------------------------- */
    function applyUpgrades(){
      CFG.lives = 3 + lvl("hp");                 // base + reinforced scales
      // combo window: base loop uses fixed catch band; we widen catchX virtually
      window.__catchBonus = lvl("combo") * 0.22; // consumed in our resolve test
      window.__dropMult   = 1 + lvl("drop")*0.15;
      window.__pwrBonus   = lvl("pwr")*0.035;    // added to powerup chance
    }
    applyUpgrades();

    /* ----- tier effects: holdings now grant a real gameplay edge ------------ */
    function tierScoreMult(){ return tierFor(econ.holdings).m; }      // already wired to score
    function tierDropMult(){ const m=tierFor(econ.holdings).m; return 1 + (m-1)*0.5; } // softer econ bonus

    /* ===================================================================== *
     *  NEW ART — drawn in the same neon language as the existing sprites      *
     * ===================================================================== */
    function glowBack2(x,S,c,r){ const g=x.createRadialGradient(S/2,S/2,8,S/2,S/2,r);
      g.addColorStop(0,c+"aa"); g.addColorStop(.55,c+"33"); g.addColorStop(1,c+"00"); x.fillStyle=g; x.fillRect(0,0,S,S); }

    // HONEYPOT — a glossy amber jar that LOOKS like a pickup but stings
    function drawHoney(x,S){
      const cx=S/2, cy=S/2; glowBack2(x,S,"#ffae00",S*0.5);
      x.save(); x.shadowColor="#ffae00"; x.shadowBlur=26;
      const g=x.createLinearGradient(0,cy-70,0,cy+86);
      g.addColorStop(0,"#ffe08a"); g.addColorStop(1,"#c97a00");
      x.fillStyle=g; roundRect(x,cx-72,cy-54,144,150,30); x.fill(); x.restore();
      x.fillStyle="#3a2400"; x.font="bold 30px Orbitron, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
      x.fillText("HONEY", cx, cy+8);
      // a sly drip + warning glint
      x.fillStyle="#fff"; x.globalAlpha=.5; x.beginPath(); x.ellipse(cx-30,cy-30,16,26,-0.5,0,7); x.fill(); x.globalAlpha=1;
      x.fillStyle="#ff3b5c"; x.font="40px serif"; x.fillText("⚠", cx+86, cy-70);
    }
    // DECOY — fake "AIRDROP" gift box
    function drawDecoy(x,S){
      const cx=S/2, cy=S/2; glowBack2(x,S,"#21e6ff",S*0.5);
      x.save(); x.shadowColor="#21e6ff"; x.shadowBlur=24; x.fillStyle="#0e3a4a";
      roundRect(x,cx-74,cy-50,148,128,18); x.fill(); x.restore();
      x.fillStyle="#21e6ff"; x.fillRect(cx-74,cy-8,148,16);
      x.fillRect(cx-8,cy-50,16,128);
      x.fillStyle="#bff6ff"; x.font="bold 22px Orbitron, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
      x.fillText("AIRDROP", cx, cy-72);
      x.font="34px serif"; x.fillText("🎁", cx, cy+96);
    }
    // power-up pickups — clean glyph chips
    function chip(x,S,color,glyph){
      const cx=S/2, cy=S/2; glowBack2(x,S,color,S*0.46);
      x.save(); x.shadowColor=color; x.shadowBlur=26;
      x.fillStyle="#0a0618"; x.beginPath(); x.arc(cx,cy,70,0,7); x.fill();
      x.lineWidth=7; x.strokeStyle=color; x.beginPath(); x.arc(cx,cy,70,0,7); x.stroke(); x.restore();
      x.fillStyle=color; x.font="58px serif"; x.textAlign="center"; x.textBaseline="middle";
      x.fillText(glyph, cx, cy+4);
    }
    const matHoney = spriteMat(drawHoney);
    const matDecoy = spriteMat(drawDecoy);
    const matSlow  = spriteMat((x,S)=>chip(x,S,"#7df9ff","⏳"));
    const matX2    = spriteMat((x,S)=>chip(x,S,GOLD,"✕2"));
    const matMag   = spriteMat((x,S)=>chip(x,S,MAG,"🧲"));
    // RUG BOSS — angrier whale variant in rug-red
    const matRug   = spriteMat((x,S)=>{ drawWhale(x,S);
      x.fillStyle="rgba(255,59,92,.28)"; x.fillRect(0,0,S,S);
      x.fillStyle=RED; x.font="bold 34px 'Press Start 2P',monospace"; x.textAlign="center"; x.textBaseline="middle";
      x.fillText("RUG", S/2, S*0.16); });

    /* ===== embedded enemy sprites (re-embedded from uploaded grid) ===== */
    (function applyEnemySprites(){
      const SPR = window.XZILLA_SPRITES; if(!SPR) return;
      const swap=(mat,key)=>{ if(!mat||!SPR[key]) return;
        const l=new THREE.TextureLoader();
        l.load(SPR[key], t=>{ t.encoding=THREE.sRGBEncoding;
          try{ t.anisotropy=4; }catch(_){}

      if (typeof myScammerMats!=="undefined" && myScammerMats){
        swap(myScammerMats[0],"kol");
        swap(myScammerMats[1],"rugger");
        swap(myScammerMats[2],"snake");
        swap(myScammerMats[3],"fudster");
      }
      if (typeof myHolderMat!=="undefined") swap(myHolderMat,"hodler");
      swap(matHoney,"honeypot");
      swap(matDecoy,"fakedrop");
      swap(matRug,"rugboss");
    })();

    /* ----- skin art: render the real Xzilla tint chips on skin cards -------- */
    // The base skin shop draws a 🦖 with a tint; we upgrade each card preview to
    // a small canvas portrait so skins read as distinct cosmetics, not an emoji.
    function skinPortrait(tint){
      const S=120, c=document.createElement("canvas"); c.width=c.height=S;
      const x=c.getContext("2d"); const col=tint||"#39ff7a";
      glowBack2(x,S,col,S*0.5);
      x.save(); x.shadowColor=col; x.shadowBlur=18; x.fillStyle="#0b1f12";
      x.beginPath(); x.arc(S/2,S/2,38,0,7); x.fill(); x.restore();
      // spikes
      x.fillStyle=col; for(let i=0;i<9;i++){ const a=Math.PI+ i/8*Math.PI;
        x.beginPath(); x.moveTo(S/2+Math.cos(a)*36,S/2+Math.sin(a)*36);
        x.lineTo(S/2+Math.cos(a)*52,S/2+Math.sin(a)*52);
        x.lineTo(S/2+Math.cos(a+0.16)*36,S/2+Math.sin(a+0.16)*36); x.closePath(); x.fill(); }
      // eyes
      x.fillStyle="#eaffea"; x.beginPath(); x.ellipse(S/2-14,S/2-2,7,10,0,0,7);
      x.ellipse(S/2+14,S/2-2,7,10,0,0,7); x.fill();
      x.fillStyle=col; x.beginPath(); x.arc(S/2-14,S/2-1,3.4,0,7); x.arc(S/2+14,S/2-1,3.4,0,7); x.fill();
      // grin
      x.strokeStyle="#eaffea"; x.lineWidth=3; x.beginPath();
      let mx=S/2-16,my=S/2+18; x.moveTo(mx,my);
      for(let i=0;i<6;i++){ mx+=5.5; my+=(i%2?5:-5); x.lineTo(mx,my); } x.stroke();
      return c.toDataURL();
    }
    // monkey-patch renderSkins to swap the emoji preview for a portrait
    const _renderSkins = renderSkins;
    renderSkins = function(){
      _renderSkins();
      try{
        $("skinsInner").querySelectorAll(".scard").forEach((card,i)=>{
          const s=SKINS[i]; if(!s) return; const prev=card.querySelector(".sprev");

            img.src=skinPortrait(s.tint); img.style.width="54px"; img.style.height="54px";
            img.style.imageRendering="auto"; prev.appendChild(img); }
        });
      }catch(e){}
    };

    /* ===================================================================== *
     *  RUNTIME STATE for power-ups / waves                                    *
     * ===================================================================== */
    const px = { slowUntil:0, x2Until:0, magUntil:0, rugHp:0, rugMax:0 };
    function nowS(){ return performance.now()*0.001; }
    function powActive(t){ return nowS() < t; }

    /* wave config: difficulty ramps in bands instead of one flat slope ------- */
    function waveProfile(){
      const w = state.wave;
      return {
        holderChance: Math.min(0.42, 0.30 + w*0.006),
        honeyChance:  Math.min(0.10, 0.02 + w*0.004),
        decoyChance:  Math.min(0.08, 0.015 + w*0.003),
        powerChance:  Math.min(0.10, CFG.powerupChance + (window.__pwrBonus||0) + w*0.002),
        speedBonus:   w*0.10

    /* ===================================================================== *
     *  SPAWN OVERRIDE — wider enemy roster + waves + power variety            *
     * ===================================================================== */
    let rugPending=false, lastBossWave=0;
    window.spawn = function(){
      // every 4th wave -> rug boss (replaces plain whale cadence)
      if(rugPending && !active.some(a=>a.type===TYPE.RUGBOSS || a.type===TYPE.BOSS)){
        rugPending=false; spawnRug(); return;
      }
      const e=getEntity(), wp=waveProfile(), r=Math.random();
      let cum=0;
      const place=(scale)=>{ e.hp=1;
        e.sprite.position.set((Math.random()*2-1)*playHalfWidth,0.9,SPAWN_Z);
        e.prevZ=SPAWN_Z; e.sprite.scale.set(scale,scale,1); active.push(e); };

      // power-up bucket
      cum += wp.powerChance;
      if(r<cum){
        const roll=Math.random();
        if(roll<0.45){ e.type=TYPE.SHIELD; e.sprite.material=myShieldMat; }
        else if(roll<0.62){ e.type=TYPE.BOMB; e.sprite.material=myBombMat; }
        else if(roll<0.75){ e.type=TYPE.PWR_SLOW; e.sprite.material=matSlow; }
        else if(roll<0.88){ e.type=TYPE.PWR_X2; e.sprite.material=matX2; }
        else { e.type=TYPE.PWR_MAG; e.sprite.material=matMag; }
        place(2.3); return;
      }
      // honeypot trap
      cum += wp.honeyChance;
      if(r<cum){ e.type=TYPE.HONEYPOT; e.sprite.material=matHoney; place(2.5); return; }
      // decoy airdrop
      cum += wp.decoyChance;
      if(r<cum){ e.type=TYPE.DECOY; e.sprite.material=matDecoy; place(2.5); return; }
      // holder (do-not-hit)
      cum += wp.holderChance;
      if(r<cum){ e.type=TYPE.HOLDER; e.sprite.material=myHolderMat; place(2.7); return; }
      // default scammer
      e.type=TYPE.SCAMMER; e.sprite.material=myScammerMats[(Math.random()*myScammerMats.length)|0];
      place(2.8);
    };

    function spawnRug(){

      px.rugHp  = px.rugMax;

      e.sprite.scale.set(6.8,6.8,1);

    /* ===================================================================== *

    const _origAddScore = window.addScore;
    window.addScore = function(base, worldPos){
      const x2 = powActive(px.x2Until) ? 2 : 1;
      _origAddScore(base * x2, worldPos);
      // wave cadence + boss scheduling on top of base behaviour
      const nw = 1 + Math.floor(state.score/150);
      if(nw>state.wave){ state.wave=nw;
        if(state.wave % 4 === 0 && state.wave!==lastBossWave){ rugPending=true; lastBossWave=state.wave; }
      }
      // rank-milestone callout — once per run, the first time you cross a new title threshold
      const t = titleForScore(state.score);
      if(t && t.name!==run.lastTitle){ run.lastTitle=t.name; showBanner("\u2605 "+t.name); sfx.wave(); flashColor("rgba(255,210,63,.3)",0.5); }
    };

    window.resolve = function(e){
      const p=e.sprite.position.clone();
      const dropMult = (window.__dropMult||1) * tierDropMult();

      if(e.type===TYPE.RUGBOSS){
        px.rugHp--; updateRugBar();
        burst(p.x,p.y,p.z,RED,18); shake(0.7); flashColor("rgba(255,59,92,.3)",0.4);
        try{sfx.catch(5);}catch(_){}
        if(px.rugHp>0){
          // survives the hit: bump it back to spawn depth so you chase it again
          e.sprite.position.z = SPAWN_Z-4; e.prevZ=e.sprite.position.z;
          popup(p,"-1 HP",RED); return;
        }
        // defeated
        burst(p.x,p.y,p.z,MAG,46); burst(p.x,p.y,p.z,RED,40); burst(p.x,p.y,p.z,GOLD,24);
        shake(1.8); flashColor("rgba(255,59,92,.5)",0.85);
        const gain=Math.round(900*tierScoreMult()); state.score+=gain; renderScore();
        const tok=Math.round(800*dropMult); econ.tokens+=tok; run.earned+=tok; run.boss++;
        run.score=Math.max(run.score,state.score);
        popup(p,"+"+gain,GOLD); bigBanner("RUGGED THE RUGGER");
        try{sfx.power();}catch(_){}
        hideRugBar();
        for(let i=active.length-1;i>=0;i--){ const a=active[i];
          if(a!==e && a.type===TYPE.SCAMMER && !a.dead){ a.dead=true;
            const ap=a.sprite.position.clone(); burst(ap.x,ap.y,ap.z,MAG,5); freeEntity(a); } }
        try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); }catch(_){}
        e.dead=true; freeEntity(e); updateHUDtokens(); return;
      }

      if(e.type===TYPE.HONEYPOT){            // looked grabbable, stings
        if(shieldActive){ shieldActive=false; burst(p.x,p.y,p.z,TEAL,12); popup(p,"TRAP BLOCKED",TEAL); try{sfx.power();}catch(_){} }
        else { popup(p,"HONEYPOT!",RED); loseLife(p); }
        e.dead=true; freeEntity(e); return;
      }
      if(e.type===TYPE.DECOY){               // fake airdrop, kills combo
        state.combo=0; renderCombo(); burst(p.x,p.y,p.z,CYAN,14);
        popup(p,"FAKE AIRDROP",CYAN); try{sfx.hit&&blip(220,0.18,"sawtooth",0.12);}catch(_){}

      if(e.type===TYPE.PWR_X2){ px.x2Until=nowS()+6; burst(p.x,p.y,p.z,GOLD,16); popup(p,"SCORE ×2",GOLD); showBanner("DOUBLE SCORE"); try{sfx.power();}catch(_){} e.dead=true; freeEntity(e); return; }
      if(e.type===TYPE.PWR_MAG){ px.magUntil=nowS()+5; burst(p.x,p.y,p.z,MAG,16); popup(p,"MAGNET",MAG); showBanner("SCAMMER MAGNET"); try{sfx.power();}catch(_){} e.dead=true; freeEntity(e); return; }

      if(e.type===TYPE.SCAMMER){
        state.combo++; state.kills++; run.kills++; if(state.combo>run.combo) run.combo=state.combo;
        try{sfx.catch(state.combo);}catch(_){}
        burst(p.x,p.y,p.z,MAG,14); window.addScore(CFG.scammerPoints,p); renderCombo();
        const tok=Math.round(2*dropMult); econ.tokens+=tok; run.earned+=tok; pop=1.22;
        if(state.combo>0 && state.combo%5===0){ showBanner(state.combo+" COMBO!"); flashColor("rgba(57,255,122,.35)",0.5); shake(0.5); }
        try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); }catch(_){}
        e.dead=true; freeEntity(e); updateHUDtokens(); return;

      if(e.type===TYPE.HOLDER){

        else loseLife(p);
        e.dead=true; freeEntity(e); return;
      }
      if(e.type===TYPE.SHIELD){ shieldActive=true; burst(p.x,p.y,p.z,TEAL,12); popup(p,"SHIELD!",TEAL); try{sfx.power();}catch(_){} e.dead=true; freeEntity(e); return; }
      if(e.type===TYPE.BOMB){
        try{sfx.power();}catch(_){} burst(p.x,p.y,p.z,GOLD,18); shake(0.7); flashColor("rgba(255,210,63,.4)",0.6); popup(p,"LIQUIDATED!",GOLD);
        for(let i=active.length-1;i>=0;i--){ const a=active[i]; if(a!==e&&a.type===TYPE.SCAMMER&&!a.dead){
          a.dead=true; const ap=a.sprite.position.clone(); burst(ap.x,ap.y,ap.z,MAG,6); state.kills++; run.kills++; window.addScore(CFG.scammerPoints,ap); freeEntity(a); } }
        e.dead=true; freeEntity(e); updateHUDtokens(); return;

    /* ===================================================================== *
     *  WIDEN CATCH on combo upgrade — patch the loop's catch test indirectly  *
     *  The base loop uses a fixed catchX; we can't edit it, but we can pull    *
     *  near-miss scammers in slightly when DIAMOND GRIP is owned.             *
     * ===================================================================== */
    (function(){
      const grip = window.__catchBonus||0;
      if(grip<=0) return;
      const prevF = window.__frame;
      window.__frame = function(dt){
        prevF(dt);
        // nudge scammers near the catch line toward the player a touch
        for(const a of active){ if(a.type===TYPE.SCAMMER && !a.dead){
          const z=a.sprite.position.z;
          if(z>PLAYER_Z-3 && z<PLAYER_Z+3){
            const dx=player.position.x-a.sprite.position.x;
            if(Math.abs(dx) < 1.85+grip) a.sprite.position.x += dx*0.18;
          }
        }}
      };
    })();

    /* ===================================================================== *
     *  LIVELINESS + KILL FX  — make enemies breathe and pop, and give every  *
     *  catch a satisfying color-coded shockwave.                             *
     * ===================================================================== */
    (function aliveAndKillFX(){
      if (typeof THREE === "undefined") return;
      const TAU = Math.PI*2;

      /* ---- shockwave ring texture (soft additive donut) ---- */
      const ringTex = makeTex((x,S)=>{
        x.clearRect(0,0,S,S); const cx=S/2;
        const g=x.createRadialGradient(cx,cx,S*0.30,cx,cx,S*0.49);
        g.addColorStop(0.0,"rgba(255,255,255,0)");
        g.addColorStop(0.62,"rgba(255,255,255,0)");
        g.addColorStop(0.80,"rgba(255,255,255,1)");
        g.addColorStop(0.92,"rgba(255,255,255,0.55)");
        g.addColorStop(1.0,"rgba(255,255,255,0)");
        x.fillStyle=g; x.beginPath(); x.arc(cx,cx,S*0.49,0,TAU); x.fill();
      },256);
      const rings=[];
      function ring(p,color,scale,life){
        const m=new THREE.SpriteMaterial({ map:ringTex, transparent:true,
          blending:THREE.AdditiveBlending, depthWrite:false, color:new THREE.Color(color) });
        const s=new THREE.Sprite(m); s.position.copy(p); s.scale.set(scale,scale,1);
        scene.add(s); rings.push({ s, t:0, life:life||0.42, from:scale, to:scale*3.2 });
      }
      function killFX(p, color, big){
        ring(p, color, big?2.2:1.3, big?0.6:0.42);
        if(big) ring(p, "#ffffff", 1.0, 0.5);
        burst(p.x, p.y, p.z, color, big?14:9);
        burst(p.x, p.y+0.35, p.z, "#ffffff", big?9:5);
      }

      /* ---- stamp life-state on each spawned entity ---- */
      const _spawn = window.spawn;
      window.spawn = function(){

        tg.ready&&tg.ready(); tg.expand&&tg.expand();
        tg.disableVerticalSwipes&&tg.disableVerticalSwipes(); } }catch(_){} }
      assert();
      // Telegram can finish expanding a beat late on iOS — re-assert once.
      setTimeout(assert, 1200);
    })();
    /* refresh HUD lives to reflect upgraded max HP on boot ------------------- */
    renderLives();
  })();

  /* -------------------------------- boot ---------------------------------- */
  applySkin(); updateVip(); updateHUDtokens(); checkStreak();
  $("tabbar").classList.remove("hidden"); showTab("PLAY");
})();

</script>
