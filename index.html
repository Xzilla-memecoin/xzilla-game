<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>XZILLA: 3D Scam Destroyer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#070318; --toxic:#39ff7a; --magenta:#ff2bd6; --cyan:#21e6ff; --gold:#ffd23f; --danger:#ff3b5c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
    overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game{ position:fixed; inset:0; }
  #fatal{ position:fixed; top:0; left:0; right:0; z-index:999; display:none;
    background:#1a0008; color:#ff6b81; font:12px/1.5 ui-monospace,monospace; padding:14px;
    white-space:pre-wrap; border-bottom:2px solid #ff3b5c; }
  canvas{ display:block; }
  #game canvas{ width:100% !important; height:100% !important; display:block; }

  #crt{ position:fixed; inset:0; pointer-events:none; z-index:30;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.14) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply; }
  #vignette{ position:fixed; inset:0; pointer-events:none; z-index:29;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,0.6) 100%); }

  #hud{ position:fixed; top:0; left:0; right:0; z-index:20; display:flex; justify-content:space-between;
    align-items:flex-start; padding:14px 16px; pointer-events:none; font-family:'Orbitron',sans-serif; color:#fff;
    padding-top:calc(14px + env(safe-area-inset-top)); }
  .hud-block{ display:flex; flex-direction:column; gap:4px; }
  .hud-right{ align-items:flex-end; }
  .hud-label{ font-size:9px; letter-spacing:2px; opacity:.6; }
  #score{ font-size:26px; font-weight:900; color:var(--cyan); text-shadow:0 0 12px var(--cyan); line-height:1; }
  #lives{ font-size:18px; letter-spacing:2px; }
  #combo{ font-family:'Press Start 2P'; font-size:11px; color:var(--toxic); text-shadow:0 0 10px var(--toxic); opacity:0; transition:opacity .15s; }
  #vipBadge{ display:none; margin-top:6px; font-family:'Press Start 2P'; font-size:8px; color:var(--gold);
    border:1px solid var(--gold); border-radius:4px; padding:4px 6px; text-shadow:0 0 8px var(--gold);
    box-shadow:0 0 12px rgba(255,210,63,.4); animation:vipPulse 1.4s ease-in-out infinite; }
  @keyframes vipPulse{ 0%,100%{box-shadow:0 0 8px rgba(255,210,63,.3)} 50%{box-shadow:0 0 20px rgba(255,210,63,.7)} }

  #popups{ position:fixed; inset:0; z-index:22; pointer-events:none; }
  .popup{ position:absolute; transform:translate(-50%,-50%); font-family:'Press Start 2P'; font-size:13px;
    white-space:nowrap; animation:floatUp .9s ease-out forwards; text-shadow:0 0 8px currentColor; }
  @keyframes floatUp{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.6)} 20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)} 100%{opacity:0;transform:translate(-50%,-150%) scale(1)} }

  #banner{ position:fixed; top:36%; left:0; right:0; text-align:center; z-index:23; font-family:'Press Start 2P';
    font-size:20px; color:var(--magenta); text-shadow:0 0 18px var(--magenta); opacity:0; pointer-events:none; }
  .banner-show{ animation:bannerFlash 1.3s ease-out forwards; }
  @keyframes bannerFlash{ 0%{opacity:0;transform:scale(.6)} 20%{opacity:1;transform:scale(1.18)} 70%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.4)} }

  .overlay{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px; font-family:'Orbitron',sans-serif; color:#fff;
    background:linear-gradient(rgba(7,3,24,.55), rgba(7,3,24,.86)); }
  .hidden{ display:none !important; }
  #heroImg{ width:210px; max-width:60vw; height:auto; margin-bottom:2px;
    filter:drop-shadow(0 0 30px rgba(57,255,122,.6)) drop-shadow(0 0 12px rgba(0,0,0,.6));
    animation:heroFloat 3.2s ease-in-out infinite; }
  @keyframes heroFloat{ 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-10px) rotate(1deg)} }
  .logo{ font-family:'Press Start 2P'; line-height:1.5; margin-bottom:6px; }
  .logo .sub{ font-size:13px; color:var(--magenta); text-shadow:0 0 12px var(--magenta); display:block; }
  .tag{ font-size:12px; letter-spacing:.5px; opacity:.88; max-width:320px; margin:12px 0 24px; line-height:1.6; }
  .tag b.good{ color:var(--magenta); } .tag b.bad{ color:var(--cyan); }
  .btn{ font-family:'Press Start 2P'; font-size:13px; letter-spacing:1px; color:#04130a; background:var(--toxic);
    border:none; border-radius:10px; padding:18px 26px; cursor:pointer; pointer-events:auto;
    box-shadow:0 0 22px rgba(57,255,122,.55), inset 0 -4px 0 rgba(0,0,0,.25); transition:transform .08s ease; }
  .btn:active{ transform:translateY(2px) scale(.98); }
  .btn.secondary{ background:transparent; color:var(--cyan); border:2px solid var(--cyan); box-shadow:0 0 16px rgba(33,230,255,.4); }
  .wallet{ margin-top:18px; font-size:10px; letter-spacing:1px; min-height:16px; color:var(--cyan); opacity:.9; word-break:break-all; max-width:300px; }
  .status-line{ margin-top:8px; font-size:10px; color:var(--gold); min-height:14px; }
  .go-title{ font-family:'Press Start 2P'; font-size:24px; color:var(--danger); text-shadow:0 0 16px var(--danger); margin-bottom:22px; }
  .stat{ font-size:13px; margin:6px 0; letter-spacing:1px; }
  .stat .num{ color:var(--cyan); font-weight:900; font-size:20px; text-shadow:0 0 10px var(--cyan); }
  .best{ color:var(--gold); }
  .go-buttons{ display:flex; flex-direction:column; gap:12px; margin-top:26px; }
  #soundBtn{ position:fixed; z-index:25; right:14px; bottom:calc(14px + env(safe-area-inset-bottom));
    width:46px; height:46px; border-radius:50%; border:1px solid rgba(255,255,255,.25);
    background:rgba(10,6,19,.6); color:#fff; font-size:18px; pointer-events:auto; cursor:pointer; }
  .blink{ animation:blink 1s steps(2,start) infinite; }
  @keyframes blink{ 50%{opacity:.25} }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="fatal"></div>
  <div id="vignette"></div>
  <div id="crt"></div>

      <span class="hud-label">SCORE</span>
      <span id="score">0</span>

    </div>
    <div class="hud-block hud-right">
      <span class="hud-label">XZILLA HP</span>
      <span id="lives">🟢🟢🟢</span>
      <span id="vipBadge">★ VIP HODLER ★</span>
    </div>
  </div>

  <div id="popups"></div>
  <div id="banner"></div>
  <button id="soundBtn" class="hidden">🔊</button>

function blip(freq,dur,type,vol,dest){
  if(!actx) return;
  try{ const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"square"; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+(dur||0.12));
    o.connect(g); g.connect(dest||sfxGain); o.start(); o.stop(actx.currentTime+(dur||0.12));
  }catch(e){}
}

// ---- looping synthwave track (A-minor: Am F C G) ----
const PROG=[ {b:55.00,t:[220.00,261.63,329.63]}, {b:43.65,t:[174.61,220.00,261.63]},
             {b:65.41,t:[261.63,329.63,392.00]}, {b:49.00,t:[196.00,246.94,293.66]} ];
let music={playing:false,step:0,next:0,timer:null,bpm:126}; let beatT=-9;
function mVoice(type,freq,t,dur,vol,lpf){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=freq; let node=o;
  if(lpf){ const f=actx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lpf; o.connect(f); node=f; }
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); node.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t+dur+0.03);
}
function mKick(t){ const o=actx.createOscillator(), g=actx.createGain();
  o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.22); beatT=t; }
function mNoise(t,dur,vol,type,freq){
  const len=Math.max(1,(actx.sampleRate*dur)|0), b=actx.createBuffer(1,len,actx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=actx.createBufferSource(); s.buffer=b; const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(musicGain); s.start(t); s.stop(t+dur); }
function scheduleStep(step,t){
  const bar=Math.floor(step/16)%4, sib=step%16, ch=PROG[bar];
  if(sib%4===0) mKick(t);
  if(sib===4||sib===12) mNoise(t,0.18,0.45,"bandpass",1900);   // snare
  if(sib%2===1) mNoise(t,0.035,0.14,"highpass",8000);          // hat
  if(sib===0||sib===8||sib===14) mVoice("sawtooth",ch.b,t,0.34,0.5,520); // bass
  if(sib%2===0){ const n=ch.t[((step/2)|0)%3]; mVoice("square",n,t,0.13,0.16,2600); } // arp
}
function musicTick(){ if(!music.playing||!actx) return;
  while(music.next < actx.currentTime+0.12){ scheduleStep(music.step,music.next);
    music.next += (60/music.bpm)/4; music.step=(music.step+1)%64; }
  music.timer=setTimeout(musicTick,25); }
function startMusic(){ if(!actx||music.playing) return; music.playing=true; music.step=0; music.next=actx.currentTime+0.1; musicTick(); }

  else if(e.type===TYPE.HOLDER){ if(shieldActive){ shieldActive=false; burst(p.x,p.y,p.z,"#39ff7a",12); popup(p,"BLOCKED!","#39ff7a"); sfx.power(); } else loseLife(p); }
  else if(e.type===TYPE.SHIELD){ shieldActive=true; burst(p.x,p.y,p.z,"#39ff7a",12); popup(p,"SHIELD!","#39ff7a"); sfx.power(); }
  else if(e.type===TYPE.BOMB){ sfx.power(); burst(p.x,p.y,p.z,"#ffd23f",18); shake(0.6); flashColor("rgba(255,210,63,.4)",0.6); popup(p,"LIQUIDATED!","#ffd23f");
    for(let i=active.length-1;i>=0;i--){ const a=active[i]; if(a!==e&&a.type===TYPE.SCAMMER&&!a.dead){ a.dead=true; const ap=a.sprite.position.clone(); burst(ap.x,ap.y,ap.z,"#ff2bd6",6); state.kills++; addScore(CFG.scammerPoints,ap); freeEntity(a);} } }

/* ============================================================ MAIN LOOP */
const clock=new THREE.Clock(); let gridOffset=0;
function loop(){ requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),0.05); const now=performance.now()*0.001;
  const scroll=dt*(state.running?state.speed:3.5); gridOffset=(gridOffset+scroll)%2; grid.position.z=-6+gridOffset; grid2.position.z=-6+gridOffset;
  const since=actx?(actx.currentTime-beatT):9, pulse=Math.max(0,1-since*6);
  grid.material.opacity=0.5+0.32*pulse; grid2.material.opacity=0.16+0.18*pulse;
  sunGlow.material.opacity=0.5+0.4*pulse; sunGlow.scale.setScalar(66+10*pulse);
  if(state.vip){ vipGlow.material.opacity=0.42+0.26*Math.sin(now*4.4); vipGlow.scale.setScalar(4.4+0.3*Math.sin(now*4.4)); }
  vipGlow.position.x=player.position.x; vipGlow.position.y=player.position.y;
  const vx=player.position.x-prevPX; prevPX=player.position.x; const moving=Math.abs(vx)>0.002;
  const cadence=state.running?(moving?17:12):9; const prevS=Math.sin(runPhase); runPhase+=dt*cadence;
  const b=Math.abs(Math.sin(runPhase));
  if(state.running && Math.sign(Math.sin(runPhase))!==Math.sign(prevS)) footPuff();
  player.position.y=0.9+b*0.42;
  const sx=1-(b-0.5)*0.12, sy=1+(b-0.5)*0.16; pop+=(1-pop)*0.18;
  player.scale.set(3.0*sx*pop, 3.0*sy*pop, 1);
  lean+=((-vx*9)-lean)*0.2; lean=Math.max(-0.2,Math.min(0.2,lean));
  player.material.rotation=Math.sin(runPhase)*0.05+lean;

  if(state.running){
    state.elapsed+=dt; state.speed=CFG.baseSpeed+state.elapsed*CFG.speedRampPerSec; state.spawnGap=Math.max(CFG.minSpawnGap,CFG.baseSpawnGap-state.elapsed*0.012);
    player.position.x+=(state.playerTargetX-player.position.x)*CFG.playerSpeedLerp; player.position.x=THREE.MathUtils.clamp(player.position.x,-playHalfWidth,playHalfWidth);
    state.spawnTimer-=dt; if(state.spawnTimer<=0){ spawn(); state.spawnTimer=state.spawnGap*(0.7+Math.random()*0.6); }
    const catchX=1.85, catchZ=1.6;
    for(let i=active.length-1;i>=0;i--){ const e=active[i]; if(e.dead) continue; e.prevZ=e.sprite.position.z; e.sprite.position.z+=state.speed*dt; const z=e.sprite.position.z;
      if(e.prevZ<PLAYER_Z+catchZ && z>=PLAYER_Z-catchZ){ if(Math.abs(e.sprite.position.x-player.position.x)<catchX){ resolve(e); continue; } }
      if(z>CAM.z+1){ if(e.type===TYPE.SCAMMER){ state.combo=0; renderCombo(); } freeEntity(e); } } }

  updateParticles(dt);
  const bob=pulse*0.10; if(state.shake>0.001){ const s=state.shake; placeCamera((Math.random()-0.5)*s,(Math.random()-0.5)*s*0.6+bob); state.shake*=0.86; } else placeCamera(0,bob);
  renderer.render(scene,camera); }
loop();

  try{ if(window.solana&&window.solana.isPhantom){ const r=await window.solana.connect(); pubkey=r.publicKey.toString(); } }catch(e){}
  if(!pubkey){ try{ pubkey=solanaWeb3.Keypair.generate().publicKey.toString(); }catch(e){ pubkey="MockWa11et"+Math.random().toString(36).slice(2,10); } }
  info.classList.remove("blink"); info.textContent="✔ "+shortKey(pubkey); connectBtn.classList.add("hidden");
  vipEl.textContent="Checking $XZILLA balance…"; let balance=0;
  try{ const conn=new solanaWeb3.Connection(SOLANA_RPC,"confirmed"); balance=await checkTokenBalance(conn,pubkey,XZILLA_MINT_ADDRESS); }catch(e){}
  state.vip = balance>0 || FORCE_VIP_FOR_DEMO;
  if(state.vip){ el.vipBadge.style.display="inline-block"; vipEl.style.color="#ffd23f";
    vipEl.textContent = balance>0 ? ("★ VIP HODLER — "+balance.toLocaleString()+" $XZILLA · 1.2x") : "★ VIP HODLER unlocked (demo) · 1.2x score"; }
  else { vipEl.style.color="#9fb6c9"; vipEl.textContent="No $XZILLA found — standard mode"; }
  startBtn.classList.remove("hidden"); }

/* ============================================================ WIRING */
document.getElementById("connectBtn").addEventListener("click",connectWallet);
document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("retryBtn").addEventListener("click",startGame);
el.sound.addEventListener("click",()=>{ state.soundOn=!state.soundOn; el.sound.textContent=state.soundOn?"🔊":"🔇"; audioInit(); if(masterGain) masterGain.gain.value=state.soundOn?1:0; });
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&state.running){ state.running=false; el.hud.classList.add("hidden"); document.getElementById("startScreen").classList.remove("hidden"); } });
document.getElementById("bestScore").textContent=state.best;
</script>
